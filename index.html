<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>أميتشي إكسبريس</title>
  <style>
    :root{--bg:#0f172a;--c:#1e293b;--b:#334155;--m:#94a3b8;--s:#16a34a;--w:#d97706;--d:#dc2626;}
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;}
    body{background:var(--bg);color:#f8fafc;padding-bottom:85px;}
    header{background:var(--c);padding:10px;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:50;}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
    .btns{display:flex;gap:4px;overflow-x:auto;}
    .btn-h{background:#334155;border:1px solid #475569;color:#fff;padding:6px 8px;border-radius:5px;font-size:0.73rem;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;}
    .s-in{width:100%;background:#0f172a;color:#fff;border:1px solid var(--b);padding:7px;border-radius:6px;font-size:0.8rem;outline:none;margin-bottom:6px;}
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
    .sel-b{background:rgba(0,0,0,0.25);padding:5px;border-radius:6px;border:1px solid var(--b);}
    .c-in{width:100%;background:#0f172a;color:#fff;border:1px solid var(--b);padding:6px;border-radius:4px;font-size:0.78rem;outline:none;}
    .kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px;margin-top:4px;}
    .kpi-b{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:8px;text-align:center;}
    .card{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:10px;margin:8px 10px;}
    .acts{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:4px;margin:6px 0;}
    .btn-a{background:transparent;border:1px solid var(--b);color:#fff;padding:5px;border-radius:5px;text-decoration:none;text-align:center;font-size:0.75rem;font-weight:bold;}
    .st-g{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
    .btn-s{border:none;padding:8px;border-radius:5px;font-weight:bold;font-size:0.75rem;cursor:pointer;color:#fff;}
    .adm-bar{display:flex;gap:4px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--b);}
    .btn-adm{flex:1;background:#334155;border:1px solid var(--b);color:#fff;padding:6px;border-radius:4px;font-size:0.73rem;cursor:pointer;font-weight:bold;}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;justify-content:center;align-items:center;padding:12px;}
    .m-box{background:var(--c);border:1px solid var(--b);border-radius:8px;width:100%;max-width:340px;padding:12px;}
    .opt-btn{width:100%;text-align:right;background:#0f172a;border:1px solid var(--b);color:#fff;padding:9px;border-radius:6px;margin-bottom:6px;font-size:0.8rem;cursor:pointer;}
  </style>
</head>
<body>
  <header>
    <div class="top">
      <h1 style="font-size:0.95rem;color:#38bdf8;">أميتشي <span id="syncStatus" style="font-size:0.65rem;color:#eab308;">⏳ اتصال...</span></h1>
      <div class="btns">
        <label class="btn-h" style="background:#0284c7;margin:0;">📷 باركود<input type="file" accept="image/*" capture="environment" style="display:none;" onchange="doScan(this)"></label>
        <button type="button" class="btn-h" style="background:#059669;" id="btnXls" onclick="openM('mX')">📁 شيت</button>
        <button type="button" class="btn-h" style="background:#0284c7;" id="btnLoc" onclick="openLocations()">📍 المناديب</button>
        <button type="button" class="btn-h" onclick="fetchShipments()">🔄 تحديث</button>
        <button type="button" class="btn-h" onclick="openM('mL')">🔐 حساب</button>
      </div>
    </div>
    <input type="text" id="q" class="s-in" placeholder="🔍 بحث بالشحنة أو الاسم أو الهاتف..." oninput="renderList()">
    <div class="g2">
      <div class="sel-b">
        <label style="font-size:0.65rem;color:var(--m);">المندوب:</label>
        <select id="cF" class="c-in" onchange="renderList()">
          <option value="all" selected>عرض كل المناديب</option>
          <option value="ahmed">أحمد</option>
          <option value="biko">بيكو</option>
          <option value="mina">مينا عبد النور</option>
        </select>
      </div>
      <div class="sel-b">
        <label style="font-size:0.65rem;color:var(--m);">الحساب الحالي:</label>
        <div id="uN" style="font-size:0.75rem;padding:4px;font-weight:bold;color:#38bdf8;">👑 المدير</div>
      </div>
    </div>
  </header>

  <div class="kpi">
    <div class="kpi-b"><div id="kC" style="font-size:1.15rem;font-weight:bold;color:#38bdf8;">0</div><div style="font-size:0.7rem;color:var(--m);">منجزة</div></div>
    <div class="kpi-b"><div id="kM" style="font-size:1.15rem;font-weight:bold;color:#38bdf8;">0 ج.م</div><div style="font-size:0.7rem;color:var(--m);">محصل</div></div>
  </div>

  <div id="lst"><p style="text-align:center;color:var(--m);margin-top:30px;">جاري التحميل...</p></div>

  <div class="modal" id="mDel"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>✅ تأكيد التسليم</b><span style="cursor:pointer;" onclick="closeM('mDel')">✕</span></div><input type="hidden" id="delId"><input type="hidden" id="delCod"><button type="button" class="opt-btn" onclick="confirmDel('كاش')">💵 استلام نقدي (كاش)</button><button type="button" class="opt-btn" onclick="confirmDel('إنستاباي / محفظة')">📱 تحويل إنستاباي / فودافون كاش</button><button type="button" class="opt-btn" onclick="confirmDel('تسليم بالفرع')">🏢 تسليم مباشر بالفرع</button></div></div>

  <div class="modal" id="mRet"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>❌ اختر سبب المرتجع</b><span style="cursor:pointer;" onclick="closeM('mRet')">✕</span></div><input type="hidden" id="retId"><button type="button" class="opt-btn" onclick="confirmRet('لا يرد')">📵 العميل لا يرد</button><button type="button" class="opt-btn" onclick="confirmRet('غير متاح / مغلق')">📴 الهاتف مغلق أو غير متاح</button><button type="button" class="opt-btn" onclick="confirmRet('العميل رفض الاستلام')">🚫 العميل رفض الاستلام</button><button type="button" class="opt-btn" onclick="confirmRet('عنوان خاطئ')">📍 العنوان غير صحيح</button><div style="display:flex;gap:4px;margin-top:4px;"><input type="text" id="customRet" class="c-in" placeholder="سبب آخر..."><button type="button" class="btn-s" style="background:var(--d);white-space:nowrap;" onclick="confirmRet(document.getElementById('customRet').value||'مرتجع')">حفظ</button></div></div></div>

  <div class="modal" id="mTr"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>🔄 نقل الأوردر لمندوب</b><span style="cursor:pointer;" onclick="closeM('mTr')">✕</span></div><input type="hidden" id="trId"><select id="trCourier" class="c-in" style="margin:6px 0 10px;"><option value="ahmed">أحمد</option><option value="biko">بيكو</option><option value="mina">مينا عبد النور</option></select><button type="button" class="btn-s" style="background:#0284c7;width:100%;" onclick="confirmTr()">نقل الأوردر الآن ➜</button></div></div>

  <div class="modal" id="mLoc"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>📍 متابعة المناديب</b><span style="cursor:pointer;" onclick="closeM('mLoc')">✕</span></div><div id="locList" style="max-height:240px;overflow-y:auto;font-size:0.8rem;">جاري جلب المواقع...</div></div></div>

  <div class="modal" id="mShp"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>🚚 تحصيل شحن فقط</b><span style="cursor:pointer;" onclick="closeM('mShp')">✕</span></div><input type="hidden" id="shpId"><input type="number" id="shpAmt" class="c-in" value="75" style="margin:6px 0 10px;"><button type="button" class="btn-s" style="background:#0d9488;width:100%;" onclick="confirmShp()">تأكيد الشحن</button></div></div>
  <div class="modal" id="mP"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>📦 استلام جزئي</b><span style="cursor:pointer;" onclick="closeM('mP')">✕</span></div><input type="hidden" id="pId"><input type="number" id="pAmt" class="c-in" placeholder="المبلغ المستلم" style="margin:6px 0 10px;"><button type="button" class="btn-s" style="background:#8b5cf6;width:100%;" onclick="confirmP()">تأكيد المبلغ</button></div></div>
  <div class="modal" id="mR"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>📅 تأجيل الشحنة</b><span style="cursor:pointer;" onclick="closeM('mR')">✕</span></div><input type="hidden" id="rId"><input type="date" id="rDate" class="c-in" style="margin:6px 0 10px;"><button type="button" class="btn-s" style="background:var(--w);width:100%;" onclick="confirmR()">حفظ التأجيل</button></div></div>
  <div class="modal" id="mX"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>📁 رفع شيت CSV</b><span style="cursor:pointer;" onclick="closeM('mX')">✕</span></div><select id="csvCourier" class="c-in" style="margin-bottom:8px;"><option value="ahmed">أحمد</option><option value="biko">بيكو</option><option value="mina">مينا عبد النور</option></select><input type="file" id="csvFile" accept=".csv,.txt" class="c-in" style="margin-bottom:8px;"><button type="button" class="btn-s" style="background:var(--s);width:100%;" onclick="uploadCSVToCloud()">رفع وتوزيع ⬆️</button></div></div>

  <div class="modal" id="mL">
    <div class="m-box">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>🔐 تسجيل الدخول</b><span style="cursor:pointer;" onclick="closeM('mL')">✕</span></div>
      <select id="roleSel" class="c-in" style="margin-bottom:8px;">
        <option value="admin">👑 المدير</option>
        <option value="ahmed">🚴 أحمد</option>
        <option value="biko">🚴 بيكو</option>
        <option value="mina">🚴 مينا عبد النور</option>
      </select>
      <input type="password" id="pinIn" class="c-in" placeholder="أدخل الرقم السري (PIN)" style="margin-bottom:10px;" inputmode="numeric">
      <button type="button" class="btn-s" style="background:#2563eb;width:100%;" onclick="switchRole()">دخول</button>
    </div>
  </div>

  <script>
    const BASE_URL = 'https://difabkjpyypaylnofbcl.supabase.co/rest/v1/';
    const API_URL = BASE_URL + 'shipments';
    const LOC_URL = BASE_URL + 'courier_locations';
    const API_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRpZmFia2pweXlwYXlsbm9mYmNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5NzY1OTksImV4cCI6MjEwOTU1MjU5OX0.THAtRh72IfpKvbXxaRK6X9mlWDlkLFjKG6O5DdROZEQ';
    const HEADERS = { 'apikey': API_KEY, 'Authorization': 'Bearer ' + API_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };
    const COURIERS = { ahmed: { name: 'أحمد', pin: '1111' }, biko: { name: 'بيكو', pin: '2222' }, mina: { name: 'مينا عبد النور', pin: '3333' } };
    const ADMIN_PIN = '1234';

    let allOrders = [], currentRole = 'admin', currentCourierId = '';
    function openM(id){ document.getElementById(id).style.display = 'flex'; }
    function closeM(id){ document.getElementById(id).style.display = 'none'; }
    function cleanText(s){ return String(s||'').replace(/[\u0000-\u001F\u007F-\u009F\uFFFD]/g,'').replace(/["']/g,'').trim(); }

    async function fetchShipments() {
      const stEl = document.getElementById('syncStatus');
      stEl.style.color = '#eab308'; stEl.innerText = '⏳ مزامنة...';
      try {
        const res = await fetch(API_URL + '?select=*&order=id.asc', { headers: HEADERS });
        if (!res.ok) throw new Error(await res.text());
        allOrders = await res.json();
        stEl.style.color = '#22c55e'; stEl.innerText = '● متصل';
        renderList();
      } catch (err) {
        stEl.style.color = '#ef4444'; stEl.innerText = '❌ خطأ';
        document.getElementById('lst').innerHTML = '<div style="text-align:center;color:#f87171;padding:20px;">خطأ اتصال: ' + err.message + '</div>';
      }
    }

    async function updateCloudOrder(id, updates) {
      document.getElementById('syncStatus').innerText = '⏳ حفظ...';
      const res = await fetch(API_URL + '?id=eq.' + id, { method: 'PATCH', headers: HEADERS, body: JSON.stringify(updates) });
      if (res.ok) await fetchShipments();
    }

    async function deleteCloudOrder(id) {
      if (!confirm('حذف الشحنة نهائياً؟')) return;
      await fetch(API_URL + '?id=eq.' + id, { method: 'DELETE', headers: HEADERS });
      await fetchShipments();
    }

    function openDel(id, cod) { document.getElementById('delId').value = id; document.getElementById('delCod').value = cod; openM('mDel'); }
    function confirmDel(m) { const id = document.getElementById('delId').value, cod = Number(document.getElementById('delCod').value)||0; closeM('mDel'); updateCloudOrder(id, { status: 'delivered', collected_amount: cod, reason: m }); }
    function openRet(id) { document.getElementById('retId').value = id; document.getElementById('customRet').value = ''; openM('mRet'); }
    function confirmRet(r) { const id = document.getElementById('retId').value; closeM('mRet'); updateCloudOrder(id, { status: 'returned', collected_amount: 0, reason: r }); }
    function openTr(id) { document.getElementById('trId').value = id; openM('mTr'); }
    function confirmTr() { const id = document.getElementById('trId').value, c = document.getElementById('trCourier').value; closeM('mTr'); updateCloudOrder(id, { courier_id: c }); }

    function sendMyLocation(cid) {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(async function(p) {
        const payload = { courier_id: cid, courier_name: COURIERS[cid].name, lat: p.coords.latitude, lng: p.coords.longitude, updated_at: new Date().toISOString() };
        await fetch(LOC_URL + '?on_conflict=courier_id', { method: 'POST', headers: Object.assign({}, HEADERS, { 'Prefer': 'resolution=merge-duplicates' }), body: JSON.stringify(payload) });
      });
    }

    async function openLocations() {
      openM('mLoc');
      const box = document.getElementById('locList');
      box.innerHTML = 'جاري جلب المواقع...';
      try {
        const res = await fetch(LOC_URL + '?select=*', { headers: HEADERS });
        const locs = await res.json();
        if (!locs.length) { box.innerHTML = '<p style="color:var(--m);">لا يوجد مناديب متصلون بـ GPS حالياً.</p>'; return; }
        let h = '';
        locs.forEach(l => {
          const t = new Date(l.updated_at).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
          h += '<div style="background:#0f172a;padding:8px;border-radius:6px;margin-bottom:6px;border:1px solid #334155;"><b>🚴 ' + l.courier_name + '</b> (' + t + ')<br><a href="https://maps.google.com/?q=' + l.lat + ',' + l.lng + '" target="_blank" style="color:#25d366;text-decoration:none;font-weight:bold;">🗺️ فتح الموقع على الخريطة</a></div>';
        });
        box.innerHTML = h;
      } catch (e) { box.innerHTML = 'تعذر تحميل المواقع.'; }
    }

    function renderList() {
      const q = (document.getElementById('q').value || '').trim().toLowerCase();
      const cid = document.getElementById('cF').value;
      const filtered = allOrders.filter(s => {
        const mQ = !q || String(s.tracking_code||'').toLowerCase().includes(q) || String(s.recipient_name||'').toLowerCase().includes(q) || String(s.delivery_address||'').toLowerCase().includes(q) || String(s.recipient_phone||'').includes(q);
        return mQ && (cid === 'all' || s.courier_id === cid);
      });

      let done = 0, money = 0, html = '';
      filtered.forEach((s, idx) => {
        const cod = Number(s.cod_amount || 0), coll = Number(s.collected_amount || 0);
        if (['delivered', 'shipping_only', 'partial'].includes(s.status)) { done++; money += coll; }
        const rsn = s.reason ? ' (' + s.reason + ')' : '';
        let badge = s.status === 'delivered' ? 'تم التسليم' + rsn + ' ✓' : s.status === 'shipping_only' ? 'شحن ('+coll+'ج)' : s.status === 'partial' ? 'استلام جزئي' : s.status === 'rescheduled' ? 'مؤجل: '+(s.rescheduled_date||'') : s.status === 'returned' ? 'مرتجع' + rsn + ' ✕' : 'قيد التوصيل';
        const cName = COURIERS[s.courier_id] ? COURIERS[s.courier_id].name : (s.courier_id || '');
        const ph = String(s.recipient_phone||'').replace(/[^0-9]/g,'');
        const wa = ph ? 'https://wa.me/2'+ph+'?text='+encodeURIComponent('السلام عليكم أستاذ '+s.recipient_name+'، شحنتك ('+s.tracking_code+') مطلوب '+cod+' ج.م') : '#';

        html += '<div class="card"><div style="display:flex;justify-content:space-between;font-weight:bold;margin-bottom:4px;"><span style="color:#38bdf8;">#'+(idx+1)+' 🏷️ '+(s.tracking_code||'')+' <small style="color:var(--m);">['+cName+']</small></span><span style="font-size:0.72rem;padding:2px 6px;border-radius:4px;background:#334155;">'+badge+'</span></div><div style="font-weight:600;">'+(s.recipient_name||'')+'</div><div style="font-size:0.75rem;color:var(--m);margin:2px 0;">'+(s.delivery_address||'')+'</div><div style="display:flex;justify-content:space-between;background:rgba(0,0,0,0.25);padding:4px 8px;border-radius:4px;margin:6px 0;font-size:0.8rem;"><span>المطلوب: <b>'+cod+'ج</b></span><span>المحصل: <b style="color:#38bdf8;">'+coll+'ج</b></span></div><div class="acts"><a href="tel:'+s.recipient_phone+'" class="btn-a">📞 اتصال</a><a href="'+wa+'" target="_blank" class="btn-a" style="border-color:#25d366;color:#25d366;">💬 واتساب</a><a href="https://maps.google.com/?q='+encodeURIComponent(s.delivery_address||'')+'" target="_blank" class="btn-a">🗺️ خريطة</a></div><div class="st-g"><button type="button" class="btn-s" style="background:var(--s);grid-column:span 2;" onclick="openDel('+s.id+','+cod+')">تم التسليم ✓</button><button type="button" class="btn-s" style="background:#8b5cf6;" onclick="openP('+s.id+')">استلام جزئي</button><button type="button" class="btn-s" style="background:#0d9488;" onclick="openShp('+s.id+')">شحن فقط 🚚</button><button type="button" class="btn-s" style="background:var(--w);" onclick="openR('+s.id+')">تأجيل 📅</button><button type="button" class="btn-s" style="background:var(--d);" onclick="openRet('+s.id+')">مرتجع ✕</button></div>'+(currentRole==='admin'?'<div class="adm-bar"><button type="button" class="btn-adm" style="background:#0284c7;" onclick="openTr('+s.id+')">🔄 تحويل لمندوب</button><button type="button" class="btn-adm" style="background:#b91c1c;" onclick="deleteCloudOrder('+s.id+')">🗑️ حذف</button></div>':'')+'</div>';
      });

      document.getElementById('lst').innerHTML = html || '<p style="text-align:center;color:var(--m);margin-top:30px;">لا توجد شحنات.</p>';
      document.getElementById('kC').innerText = done;
      document.getElementById('kM').innerText = money + ' ج.م';
    }

    function openShp(id){ document.getElementById('shpId').value = id; openM('mShp'); }
    function confirmShp(){ const id=document.getElementById('shpId').value, amt=Number(document.getElementById('shpAmt').value)||0; closeM('mShp'); updateCloudOrder(id,{status:'shipping_only',collected_amount:amt,reason:''}); }
    function openP(id){ document.getElementById('pId').value = id; openM('mP'); }
    function confirmP(){ const id=document.getElementById('pId').value, amt=Number(document.getElementById('pAmt').value)||0; closeM('mP'); updateCloudOrder(id,{status:'partial',collected_amount:amt,reason:''}); }
    function openR(id){ document.getElementById('rId').value = id; openM('mR'); }
    function confirmR(){ const id=document.getElementById('rId').value, d=document.getElementById('rDate').value; closeM('mR'); updateCloudOrder(id,{status:'rescheduled',collected_amount:0,rescheduled_date:d,reason:''}); }

    function uploadCSVToCloud() {
      const file = document.getElementById('csvFile').files[0];
      if (!file) return alert('اختر ملف CSV أولاً');
      const courier = document.getElementById('csvCourier').value;
      const reader = new FileReader
