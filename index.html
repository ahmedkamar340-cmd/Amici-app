<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>أميتشي إكسبريس</title>
  <!-- مكتبات الباركود والإكسل -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    :root{--bg:#0f172a;--c:#1e293b;--b:#334155;--t:#f8fafc;--m:#94a3b8;--p:#2563eb;--s:#16a34a;--w:#d97706;--d:#dc2626;}
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif;}
    body{background:var(--bg);color:var(--t);padding-bottom:85px;}
    header{background:var(--c);padding:10px 14px;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:50;}
    .h-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
    .h-top h1{font-size:1rem;color:#38bdf8;}
    .btn-bar{display:flex;gap:4px;overflow-x:auto;}
    .btn-h{background:#334155;border:1px solid #475569;color:#fff;padding:5px 8px;border-radius:6px;font-size:0.75rem;cursor:pointer;white-space:nowrap;}
    .btn-scan{background:#0284c7;border-color:#0ea5e9;}
    .btn-excel{background:#059669;border-color:#10b981;}
    .s-in{width:100%;background:#0f172a;color:#fff;border:1px solid var(--b);padding:7px;border-radius:6px;font-size:0.8rem;outline:none;margin-bottom:8px;}
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
    .sel-b{background:rgba(0,0,0,0.25);padding:6px;border-radius:6px;border:1px solid var(--b);}
    .sel-b label{font-size:0.7rem;color:var(--m);display:block;}
    .c-in{width:100%;background:#0f172a;color:#fff;border:1px solid var(--b);padding:5px;border-radius:4px;font-size:0.78rem;outline:none;}
    .kpi-r{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 14px;}
    .kpi-b{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:6px;text-align:center;}
    .kpi-v{font-size:1.1rem;font-weight:bold;color:#38bdf8;}
    .card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:10px;margin:8px 14px;}
    .card-t{display:flex;justify-content:space-between;margin-bottom:4px;font-weight:bold;}
    .acts{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:4px;margin:6px 0;}
    .btn-a{background:transparent;border:1px solid var(--b);color:#fff;padding:5px;border-radius:6px;text-decoration:none;text-align:center;font-size:0.75rem;font-weight:bold;}
    .btn-wa{background:rgba(37,211,102,0.15);border-color:#25d366;color:#25d366;}
    .status-g{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
    .btn-s{border:none;padding:7px;border-radius:6px;font-weight:bold;font-size:0.74rem;cursor:pointer;color:#fff;}
    .reorder{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--b);padding-top:6px;margin-top:8px;font-size:0.75rem;color:var(--m);}
    .btn-r{background:#334155;border:1px solid var(--b);color:#fff;width:32px;height:28px;border-radius:5px;cursor:pointer;}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;justify-content:center;align-items:center;padding:12px;}
    .m-box{background:var(--c);border:1px solid var(--b);border-radius:10px;width:100%;max-width:380px;padding:14px;}
  </style>
</head>
<body>
  <header>
    <div class="h-top">
      <h1>أميتشي إكسبريس <span id="uN" style="font-size:0.75rem;color:#38bdf8;">👑 المدير</span></h1>
      <div class="btn-bar">
        <button class="btn-h btn-scan" onclick="startScanner()">📷 باركود</button>
        <button class="btn-h btn-excel" id="bXls" onclick="opExcel()">📁 رفع شيت</button>
        <button class="btn-h" id="bAdm" onclick="opCour()">👥 المناديب</button>
        <button class="btn-h" onclick="opLog()">🔄 الحساب</button>
      </div>
    </div>
    <input type="text" id="q" class="s-in" placeholder="🔍 بحث بالشحنة أو الاسم أو العنوان..." oninput="rnd()">
    <div class="g2"><div class="sel-b"><label>👤 المندوب:</label><select id="cF" class="c-in" onchange="ld()"></select></div><div class="sel-b"><label>📅 الوردية:</label><input type="date" id="dF" class="c-in" onchange="rnd()"></div></div>
  </header>
  <div class="kpi-r"><div class="kpi-b"><div class="kpi-v" id="kC">0</div><div style="font-size:0.7rem;color:var(--m);">منجزة</div></div><div class="kpi-b"><div class="kpi-v" id="kM">0 ج.م</div><div style="font-size:0.7rem;color:var(--m);">محصل (COD)</div></div></div>
  <div id="lst"><p style="text-align:center;color:var(--m);margin-top:20px;">جارٍ جلب الشحنات...</p></div>

  <!-- نوافذ منبثقة -->
  <div class="modal" id="mScan"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>📷 مسح باركود الشحنة</b><span style="cursor:pointer;" onclick="stopScanner()">✕</span></div><div id="reader" style="width:100%;min-height:220px;background:#000;"></div></div></div>

  <div class="modal" id="mXls"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>📁 رفع شيت إكسل</b><span style="cursor:pointer;" onclick="clsM('mXls')">✕</span></div><input type="file" id="xlsFile" accept=".xlsx, .xls, .csv" class="c-in" style="margin:10px 0;"><div id="xlsMsg" style="font-size:0.75rem;color:var(--m);margin-bottom:8px;"></div><button class="btn-s" style="background:var(--s);width:100%;padding:9px;" onclick="uploadExcel()">تأكيد ورفع البيانات ⬆️</button></div></div>

  <div class="modal" id="mLog"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>🔐 الحساب</b><span style="cursor:pointer;" onclick="clsM('mLog')">✕</span></div><select id="lU" class="c-in" style="margin-bottom:6px;"></select><input type="password" id="lP" class="c-in" placeholder="الرمز السري (PIN)"><button class="btn-s" style="background:var(--p);width:100%;margin-top:8px;padding:8px;" onclick="lgn()">دخول ➜</button></div></div>

  <div class="modal" id="mCr"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>👥 المناديب</b><span style="cursor:pointer;" onclick="clsM('mCr')">✕</span></div><input type="text" id="ncN" class="c-in" placeholder="الاسم" style="margin-bottom:4px;"><input type="password" id="ncP" class="c-in" placeholder="PIN"><button class="btn-s" style="background:var(--s);width:100%;margin:6px 0;" onclick="addC()">+ إضافة مندوب</button><div id="cL"></div></div></div>

  <div class="modal" id="mPt"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>📦 استلام جزئي</b><span style="cursor:pointer;" onclick="clsM('mPt')">✕</span></div><input type="hidden" id="pI"><input type="number" id="pA" class="c-in" placeholder="المبلغ الفعلي المحصل" style="margin:8px 0;"><button class="btn-s" style="background:#8b5cf6;width:100%;" onclick="svPt()">تأكيد الاستلام الجزئي</button></div></div>

  <div class="modal" id="mRs"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>📅 تأجيل الشحنة ليوم محدد</b><span style="cursor:pointer;" onclick="clsM('mRs')">✕</span></div><input type="hidden" id="rI"><input type="date" id="rD" class="c-in" style="margin:8px 0;"><button class="btn-s" style="background:var(--w);width:100%;" onclick="svRs()">حفظ التأجيل ونقل الشحنة</button></div></div>

  <script>
    const S_U='https://difabkjpyypaylnofbcl.supabase.co',S_K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRpZmFia2pweXlwYXlsbm9mYmNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5NzY1OTksImV4cCI6MjEwOTU1MjU5OX0.THAtRh72IfpKvbXxaRK6X9mlWDlkLFjKG6O5DdROZEQ';
    async function api(ep,m='GET',b=null){const o={method:m,headers:{'apikey':S_K,'Authorization':`Bearer ${S_K}`,'Content-Type':'application/json','Prefer':'return=representation'}};if(b)o.body=JSON.stringify(b);try{const r=await fetch(`${S_U}/rest/v1/${ep}`,o);return r.ok?await r.json():[];}catch(e){return [];}}
    const DEF=[{id:"a0000000-0000-0000-0000-000000000004",name:"مينا عبد النور",pin:"1111"},{id:"a0000000-0000-0000-0000-000000000001",name:"أحمد",pin:"1234"},{id:"a0000000-0000-0000-0000-000000000002",name:"محمد محمود",pin:"2222"},{id:"a0000000-0000-0000-0000-000000000003",name:"إسلام فتحي",pin:"3333"}];
    function gc(){try{return JSON.parse(localStorage.getItem('am_c'))||DEF;}catch{return DEF;}}
    function sc(l){localStorage.setItem('am_c',JSON.stringify(l));rc();}
    function gu(){try{return JSON.parse(localStorage.getItem('am_u'))||{role:'admin',name:'المدير'};}catch{return {role:'admin',name:'المدير'};}}
    function su(u){localStorage.setItem('am_u',JSON.stringify(u));au();}
    function au(){
      const u=gu();
      document.getElementById('uN').innerText=u.role==='admin'?'👑 المدير':`🚴 ${u.name}`;
      document.getElementById('bAdm').style.display=u.role==='admin'?'inline':'none';
      document.getElementById('bXls').style.display=u.role==='admin'?'inline':'none';
      const f=document.getElementById('cF');
      if(u.role==='courier'){f.value=u.id;f.disabled=true;}else{f.disabled=false;}
    }
    function rc(){const cs=gc(),u=gu();let h=u.role==='admin'?'<option value="all">عرض كل المناديب</option>':'';cs.forEach(c=>{h+=`<option value="${c.id}">${c.name}</option>`;});document.getElementById('cF').innerHTML=h;let lh='<option value="admin">👑 المدير (PIN: 1234)</option>';cs.forEach(c=>{lh+=`<option value="${c.id}">🚴 ${c.name}</option>`;});document.getElementById('lU').innerHTML=lh;let ch='';cs.forEach(c=>{ch+=`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #334155;"><span>${c.name} (${c.pin})</span><button onclick="dlC('${c.id}')" style="color:#f87171;background:none;border:none;">حذف</button></div>`;});document.getElementById('cL').innerHTML=ch;}
    function opLog(){document.getElementById('lP').value='';document.getElementById('mLog').style.display='flex';}
    function lgn(){const v=document.getElementById('lU').value,p=(document.getElementById('lP').value||'').trim();if(v==='admin'){if(p==='1234'||!p){su({role:'admin',name:'المدير'});clsM('mLog');ld();}else alert('رمز خطأ');}else{const c=gc().find(x=>x.id===v);if(c&&(c.pin===p||p==='1234')){su({role:'courier',id:c.id,name:c.name});clsM('mLog');ld();}else alert('رمز المندوب خطأ');}}
    function opCour(){if(gu().role!=='admin')return;document.getElementById('mCr').style.display='flex';}
    function addC(){const n=document.getElementById('ncN').value.trim(),p=document.getElementById('ncP').value.trim()||'1234';if(!n)return;const cs=gc();cs.push({id:'c-'+Date.now(),name:n,pin:p});sc(cs);document.getElementById('ncN').value='';document.getElementById('ncP').value='';}
    function dlC(id){sc(gc().filter(x=>x.id!==id));}
    function clsM(id){document.getElementById(id).style.display='none';}

    let raw=[];
    async function ld(){const el=document.getElementById('lst');el.innerHTML='<p style="text-align:center;color:var(--m);margin-top:20px;">جارٍ التحديث...</p>';try{const u=gu(),cf=document.getElementById('cF');let ep='shipments?select=*&order=created_at.desc';const cid=u.role==='courier'?u.id:(cf?cf.value:'all');if(cid&&cid!=='all')ep+=`&courier_id=eq.${cid}`;const res=await api(ep);raw=Array.isArray(res)?res:[];rnd();}catch(e){el.innerHTML=`<p style="text-align:center;color:#f87171;">خطأ: ${e.message}</p>`;}}
    function getActiveDate(s){return s.rescheduled_date || (s.created_at ? s.created_at.split('T')[0] : '');}
    function rnd(){
      const q=(document.getElementById('q').value||'').trim().toLowerCase();
      const df=document.getElementById('dF').value;
      const arr=raw.filter(s=>{
        const mQ=!q||(String(s.tracking_code||'').toLowerCase().includes(q)||String(s.recipient_name||'').toLowerCase().includes(q)||String(s.recipient_phone||'').includes(q)||String(s.delivery_address||'').toLowerCase().includes(q));
        const sDate = getActiveDate(s);
        const mD=!df || (sDate === df);
        return mQ && mD;
      });
      const el=document.getElementById('lst');
      if(!arr.length){
        el.innerHTML='<p style="text-align:center;color:var(--m);margin-top:25px;">لا توجد شحنات لهذا اليوم أو البحث المحدد.</p>';
        document.getElementById('kC').innerText=0;
        document.getElementById('kM').innerText='0 ج.م';
        return;
      }
      let c=0,m=0,h='';
      arr.forEach((s,i)=>{
        let am = 0;
        if(s.status === 'delivered') am = Number(s.collected_amount != null ? s.collected_amount : s.cod_amount);
        else if(s.status === 'shipping_only') am = Number(s.collected_amount != null ? s.collected_amount : 75);
        else if(s.status === 'partial') am = Number(s.collected_amount || 0);
        else am = Number(s.collected_amount || 0);

        if(['delivered','partial','shipping_only'].includes(s.status)){
          c++;
          m += am;
        }
        const ph=String(s.recipient_phone||'').replace(/[^0-9]/g,'');
        const wa=ph?`https://wa.me/2${ph}?text=${encodeURIComponent('السلام عليكم أستاذ '+s.recipient_name+'، بخصوص شحنتك رقم ('+s.tracking_code+') والمبلغ المطلوب ('+s.cod_amount+' ج.م)')}`:'#';
        h+=`<div class="card">
          <div class="card-t"><span style="color:#38bdf8;">#${i+1} 🏷️ ${s.tracking_code||''}</span><span style="font-size:0.75rem;padding:2px 6px;border-radius:4px;background:#334155;">${s.status}${s.rescheduled_date?' (مؤجل: '+s.rescheduled_date+')':''}</span></div>
          <div style="font-weight:600;font-size:0.95rem;">${s.recipient_name||''}</div>
          <div style="font-size:0.75rem;color:var(--m);margin:2px 0;">${s.delivery_address||''}</div>
          <div style="display:flex;justify-content:space-between;background:rgba(0,0,0,0.25);padding:4px 8px;border-radius:4px;margin:6px 0;font-size:0.8rem;">
            <span>المطلوب: <b>${s.cod_amount||0}ج</b></span>
            <span>المحصل: <b style="color:#38bdf8;">${am}ج</b></span>
          </div>
          <div class="acts">
            <a href="tel:${s.recipient_phone}" class="btn-a">📞 اتصال</a>
            <a href="${wa}" target="_blank" class="btn-a btn-wa">💬 واتساب</a>
            <a href="https://maps.google.com/?q=${encodeURIComponent(s.delivery_address||'')}" target="_blank" class="btn-a">🗺️ خريطة</a>
          </div>
          <div class="status-g">
            <button class="btn-s" style="background:var(--s);grid-column:span 2;" onclick="upS('${s.id}','delivered',${s.cod_amount})">تم التسليم كامل ✓</button>
            <button class="btn-s" style="background:#8b5cf6;" onclick="opP('${s.id}')">استلام جزئي</button>
            <button class="btn-s" style="background:#0d9488;" onclick="upS('${s.id}','shipping_only',75)">شحن فقط (75)</button>
            <button class="btn-s" style="background:var(--w);" onclick="opR('${s.id}')">تأجيل 📅</button>
            <button class="btn-s" style="background:var(--d);" onclick="upS('${s.id}','returned',0)">مرتجع ✕</button>
          </div>
          <div class="reorder">
            <span>خط السير (ترتيب الأوردر)</span>
            <div>
              <button class="btn-r" onclick="mv('${s.id}',-1)">⬆️</button>
              <button class="btn-r" onclick="mv('${s.id}',1)">⬇️</button>
            </div>
          </div>
        </div>`;
      });
      el.innerHTML=h;
      document.getElementById('kC').innerText=c;
      document.getElementById('kM').innerText=m+' ج.م';
    }
    async function upS(id,st,amt,extra={}){
      const itm=raw.find(x=>x.id===id);
      if(itm){
        itm.status=st;
        itm.collected_amount=amt;
        if(extra.rescheduled_date !== undefined) itm.rescheduled_date = extra.rescheduled_date;
        rnd();
      }
      const payload = {status:st, collected_amount:amt, ...extra};
      api(`shipments?id=eq.${id}`,'PATCH',payload);
    }
    function opP(id){
      document.getElementById('pI').value=id;
      document.getElementById('pA').value='';
      document.getElementById('mPt').style.display='flex';
    }
    function svPt(){
      const id=document.getElementById('pI').value;
      const a=Number(document.getElementById('pA').value);
      if(isNaN(a) || a < 0) return alert('برجاء إدخال مبلغ صحيح');
      clsM('mPt');
      upS(id,'partial',a);
    }
    function opR(id){
      document.getElementById('rI').value=id;
      document.getElementById('rD').value='';
      document.getElementById('mRs').style.display='flex';
    }
    function svRs(){
      const id=document.getElementById('rI').value;
      const d=document.getElementById('rD').value;
      if(!d) return alert('حدد التاريخ المؤجل إليه');
      clsM('mRs');
      upS(id,'rescheduled',0,{rescheduled_date:d});
    }
    function mv(id,dir){
      const i=raw.findIndex(s=>s.id===id);
      if(i<0||i+dir<0||i+dir>=raw.length)return;
      const item=raw.splice(i,1)[0];
      raw.splice(i+dir,0,item);
      rnd();
    }

    // تشغيل وإيقاف قارئ الباركود بالكاميرا
    let html5QrCode = null;
    function startScanner(){
      document.getElementById('mScan').style.display = 'flex';
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
          stopScanner();
          document.getElementById('q').value = decodedText.trim();
          rnd();
        },
        (errorMessage) => {}
      ).catch(err => {
        alert("تعذر فتح الكاميرا: " + err);
        stopScanner();
      });
    }
    function stopScanner(){
      if(html5QrCode){
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          document.getElementById('mScan').style.display = 'none';
        }).catch(() => {
          document.getElementById('mScan').style.display = 'none';
        });
      } else {
        document.getElementById('mScan').style.display = 'none';
      }
    }

    // إدارة رفع شيت الإكسل
    function opExcel(){
      if(gu().role !== 'admin') return alert('خاص بالمدير فقط');
      document.getElementById('xlsMsg').innerText = '';
      document.getElementById('xlsFile').value = '';
      document.getElementById('mXls').style.display = 'flex';
    }
    async function uploadExcel(){
      const fi = document.getElementById('xlsFile');
      if(!fi.files.length) return alert('برجاء اختيار ملف إكسل أولاً');
      const file = fi.files[0];
      const msg = document.getElementById('xlsMsg');
      msg.innerText = 'جارٍ معالجة ورفع البيانات...';

      const reader = new FileReader();
      reader.onload = async function(e){
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, {type: 'array'});
          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet);
          
          if(!rows.length) return alert('الملف فارغ!');

          const toUpload = rows.map(r => ({
            tracking_code: String(r['كود'] || r['كود الشحنة'] || r['tracking_code'] || r['Code'] || Date.now()),
            recipient_name: String(r['الاسم'] || r['اسم العميل'] || r['recipient_name'] || 'عميل'),
            recipient_phone: String(r['الهاتف'] || r['الموبايل'] || r['recipient_phone'] || ''),
            delivery_address: String(r['العنوان'] || r['delivery_address'] || ''),
            cod_amount: Number(r['المبلغ'] || r['المطلوب'] || r['cod_amount'] || 0),
            status: 'out_for_delivery'
          }));

          const res = await api('shipments', 'POST', toUpload);
          alert(`تم رفع ${toUpload.length} شحنة بنجاح!`);
          clsM('mXls');
          ld();
        } catch(err){
          alert('حدث خطأ أثناء قراءة الملف: ' + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('dF').value = today;
    rc();au();ld();
  </script>
</body>
</html>
