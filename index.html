<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>أميتشي إكسبريس</title>
  <style>
    :root{--bg:#0f172a;--c:#1e293b;--b:#334155;--m:#94a3b8;--s:#16a34a;--w:#d97706;--d:#dc2626;}
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;}
    body{background:var(--bg);color:#f8fafc;padding-bottom:80px;}
    header{background:var(--c);padding:10px;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:50;}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
    .btns{display:flex;gap:4px;overflow-x:auto;}
    .btn-h{background:#334155;border:1px solid #475569;color:#fff;padding:6px 9px;border-radius:5px;font-size:0.75rem;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;}
    .s-in{width:100%;background:#0f172a;color:#fff;border:1px solid var(--b);padding:7px;border-radius:6px;font-size:0.8rem;outline:none;margin-bottom:6px;}
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
    .sel-b{background:rgba(0,0,0,0.25);padding:5px;border-radius:6px;border:1px solid var(--b);}
    .c-in{width:100%;background:#0f172a;color:#fff;border:1px solid var(--b);padding:5px;border-radius:4px;font-size:0.75rem;outline:none;}
    .kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px;margin-top:4px;}
    .kpi-b{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:8px;text-align:center;}
    .card{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:10px;margin:8px 10px;}
    .acts{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:4px;margin:6px 0;}
    .btn-a{background:transparent;border:1px solid var(--b);color:#fff;padding:5px;border-radius:5px;text-decoration:none;text-align:center;font-size:0.75rem;font-weight:bold;}
    .st-g{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
    .btn-s{border:none;padding:8px;border-radius:5px;font-weight:bold;font-size:0.75rem;cursor:pointer;color:#fff;}
    .adm-bar{display:flex;gap:4px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--b);}
    .btn-adm{flex:1;background:#334155;border:1px solid var(--b);color:#fff;padding:5px;border-radius:4px;font-size:0.72rem;cursor:pointer;}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;justify-content:center;align-items:center;padding:12px;}
    .m-box{background:var(--c);border:1px solid var(--b);border-radius:8px;width:100%;max-width:340px;padding:12px;}
  </style>
</head>
<body>
  <header>
    <div class="top">
      <h1 style="font-size:0.95rem;color:#38bdf8;">أميتشي <span id="uN" style="font-size:0.75rem;color:#fff;">👑 المدير</span></h1>
      <div class="btns">
        <label class="btn-h" style="background:#0284c7;margin:0;">
          📷 باركود
          <input type="file" accept="image/*" capture="environment" id="camIn" style="display:none;" onchange="doScan(this)">
        </label>
        <button type="button" class="btn-h" style="background:#059669;" onclick="opM('mX')">📁 شيت</button>
        <button type="button" class="btn-h" style="background:#0284c7;" onclick="opLoc()">📍 المناديب</button>
        <button type="button" class="btn-h" onclick="opM('mC')">👥 مناديب</button>
        <button type="button" class="btn-h" onclick="opM('mL')">🔄 حساب</button>
      </div>
    </div>
    <input type="text" id="q" class="s-in" placeholder="🔍 بحث بالشحنة أو الاسم..." oninput="rnd()">
    <div class="g2">
      <div class="sel-b">
        <label style="font-size:0.65rem;color:var(--m);">المندوب:</label>
        <select id="cF" class="c-in" onchange="rnd()">
          <option value="all">عرض كل المناديب</option>
          <option value="ahmed" selected>أحمد</option>
          <option value="biko">بيكو</option>
          <option value="mina">مينا عبد النور</option>
        </select>
      </div>
      <div class="sel-b">
        <label style="font-size:0.65rem;color:var(--m);">الوردية:</label>
        <input type="date" id="dF" class="c-in" value="2026-11-08">
      </div>
    </div>
  </header>

  <div class="kpi">
    <div class="kpi-b"><div id="kC" style="font-size:1.15rem;font-weight:bold;color:#38bdf8;">0</div><div style="font-size:0.7rem;color:var(--m);">منجزة</div></div>
    <div class="kpi-b"><div id="kM" style="font-size:1.15rem;font-weight:bold;color:#38bdf8;">0 ج.م</div><div style="font-size:0.7rem;color:var(--m);">محصل</div></div>
  </div>

  <div id="lst"></div>

  <!-- النوافذ -->
  <div class="modal" id="mShp">
    <div class="m-box">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>🚚 تحصيل شحن فقط</b><span style="cursor:pointer;" onclick="clsM('mShp')">✕</span></div>
      <input type="hidden" id="shpId">
      <label style="font-size:0.75rem;color:var(--m);">مبلغ الشحن المطلوب:</label>
      <input type="number" id="shpAmt" class="c-in" value="75" style="margin:6px 0 10px;">
      <button type="button" class="btn-s" style="background:#0d9488;width:100%;" onclick="svShp()">تأكيد الشحن</button>
    </div>
  </div>

  <div class="modal" id="mP">
    <div class="m-box">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>📦 استلام جزئي</b><span style="cursor:pointer;" onclick="clsM('mP')">✕</span></div>
      <input type="hidden" id="pI">
      <label style="font-size:0.75rem;color:var(--m);">المبلغ الفعلي المستلم:</label>
      <input type="number" id="pA" class="c-in" placeholder="المبلغ" style="margin:6px 0 10px;">
      <button type="button" class="btn-s" style="background:#8b5cf6;width:100%;" onclick="svP()">تأكيد المبلغ</button>
    </div>
  </div>

  <div class="modal" id="mR">
    <div class="m-box">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>📅 تأجيل الشحنة</b><span style="cursor:pointer;" onclick="clsM('mR')">✕</span></div>
      <input type="hidden" id="rI">
      <input type="date" id="rD" class="c-in" style="margin:6px 0 10px;">
      <button type="button" class="btn-s" style="background:var(--w);width:100%;" onclick="svR()">حفظ التأجيل</button>
    </div>
  </div>

  <div class="modal" id="mTr">
    <div class="m-box">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>🔄 تحويل الشحنة</b><span style="cursor:pointer;" onclick="clsM('mTr')">✕</span></div>
      <input type="hidden" id="trId">
      <select id="trCourier" class="c-in" style="margin:6px 0 10px;">
        <option value="ahmed">أحمد</option><option value="biko">بيكو</option><option value="mina">مينا عبد النور</option>
      </select>
      <button type="button" class="btn-s" style="background:#0284c7;width:100%;" onclick="svTr()">تحويل الآن ➜</button>
    </div>
  </div>

  <div class="modal" id="mX">
    <div class="m-box">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>📁 رفع شيت</b><span style="cursor:pointer;" onclick="clsM('mX')">✕</span></div>
      <select id="xCr" class="c-in" style="margin-bottom:6px;"><option value="ahmed">أحمد</option><option value="biko">بيكو</option></select>
      <input type="file" id="xf" accept=".csv,.txt" class="c-in" style="margin-bottom:8px;">
      <button type="button" class="btn-s" style="background:var(--s);width:100%;" onclick="upX()">رفع الشحنات</button>
    </div>
  </div>

  <div class="modal" id="mLoc"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>📍 مواقع المناديب</b><span style="cursor:pointer;" onclick="clsM('mLoc')">✕</span></div><div id="locBody"></div></div></div>
  <div class="modal" id="mL"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>🔐 الحساب</b><span style="cursor:pointer;" onclick="clsM('mL')">✕</span></div><select id="lU" class="c-in" style="margin-bottom:6px;"><option value="admin">👑 المدير</option><option value="ahmed">🚴 أحمد</option></select><button type="button" class="btn-s" style="background:#2563eb;width:100%;margin-top:6px;" onclick="lgn()">دخول</button></div></div>
  <div class="modal" id="mC"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>👥 المناديب</b><span style="cursor:pointer;" onclick="clsM('mC')">✕</span></div><input type="text" id="ncN" class="c-in" placeholder="اسم المندوب" style="margin-bottom:4px;"><button type="button" class="btn-s" style="background:var(--s);width:100%;" onclick="addC()">+ إضافة</button><div id="cL" style="margin-top:6px;"></div></div></div>

  <script>
    const DEFAULT_SHIPMENTS = [
      { id:"1", tracking_code:"7791", recipient_name:"Demyana Botros Zachary", recipient_phone:"01001232790", delivery_address:"الاسكندرية العجمي البيطاش ش مسجد الهدي الاندلس والحجاز عمارة 2", cod_amount:190, status:"delivered", collected_amount:190, courier_id:"ahmed" },
      { id:"2", tracking_code:"12258", recipient_name:"شروق", recipient_phone:"01059947327", delivery_address:"شارع العوامي خلف مدرسة العجمي النموذجية عمارة سنتر الفيروز", cod_amount:610, status:"returned", collected_amount:0, courier_id:"ahmed" },
      { id:"3", tracking_code:"12282", recipient_name:"فيلوباتير", recipient_phone:"01507992457", delivery_address:"105 ش المكس القباري - اسكندرية", cod_amount:610, status:"out_for_delivery", collected_amount:0, courier_id:"ahmed" }
    ];

    let raw = [];
    try {
      const stored = localStorage.getItem('am_active_orders_clean');
      if (stored) {
        raw = JSON.parse(stored);
      }
    } catch(e) {}
    if (!Array.isArray(raw) || raw.length === 0) {
      raw = JSON.parse(JSON.stringify(DEFAULT_SHIPMENTS));
      localStorage.setItem('am_active_orders_clean', JSON.stringify(raw));
    }

    let actId = null;
    function opM(id){ document.getElementById(id).style.display = 'flex'; }
    function clsM(id){ document.getElementById(id).style.display = 'none'; }

    function rnd(){
      const q = (document.getElementById('q').value||'').trim().toLowerCase();
      const cid = document.getElementById('cF').value;

      const list = raw.filter(s => {
        const mQ = !q || (String(s.tracking_code||'').toLowerCase().includes(q) || String(s.recipient_name||'').toLowerCase().includes(q) || String(s.delivery_address||'').toLowerCase().includes(q) || String(s.recipient_phone||'').includes(q));
        const mC = (cid === 'all' || s.courier_id === cid || !s.courier_id);
        return mQ && mC;
      });

      let done = 0, money = 0, h = '';
      list.forEach((s, i) => {
        let am = 0;
        if(s.status === 'delivered') am = Number(s.collected_amount!=null ? s.collected_amount : s.cod_amount);
        else if(s.status === 'shipping_only') am = Number(s.collected_amount!=null ? s.collected_amount : 75);
        else if(s.status === 'partial') am = Number(s.collected_amount || 0);

        if(['delivered','partial','shipping_only'].includes(s.status)){ done++; money += am; }

        const ph = String(s.recipient_phone||'').replace(/[^0-9]/g,'');
        const wa = ph ? `https://wa.me/2${ph}?text=${encodeURIComponent('السلام عليكم أستاذ '+s.recipient_name+'، بخصوص شحنتك رقم ('+s.tracking_code+') والمطلوب '+s.cod_amount+' ج.م')}` : '#';

        let badge = s.status === 'delivered' ? 'تم التسليم ✓' :
                    s.status === 'shipping_only' ? `شحن (${am}ج)` :
                    s.status === 'partial' ? 'استلام جزئي' :
                    s.status === 'rescheduled' ? `مؤجل: ${s.rescheduled_date||''}` :
                    s.status === 'returned' ? 'مرتجع ✕' : 'قيد التوصيل';

        h += `
        <div class="card">
          <div style="display:flex;justify-content:space-between;font-weight:bold;margin-bottom:4px;">
            <span style="color:#38bdf8;">#${i+1} 🏷️ ${s.tracking_code||''}</span>
            <span style="font-size:0.75rem;padding:2px 6px;border-radius:4px;background:#334155;">${badge}</span>
          </div>
          <div style="font-weight:600;">${s.recipient_name||''}</div>
          <div style="font-size:0.75rem;color:var(--m);margin:2px 0;">${s.delivery_address||''}</div>
          <div style="display:flex;justify-content:space-between;background:rgba(0,0,0,0.25);padding:4px 8px;border-radius:4px;margin:6px 0;font-size:0.8rem;">
            <span>المطلوب: <b>${s.cod_amount||0}ج</b></span>
            <span>المحصل: <b style="color:#38bdf8;">${am}ج</b></span>
          </div>
          <div class="acts">
            <a href="tel:${s.recipient_phone}" class="btn-a">📞 اتصال</a>
            <a href="${wa}" target="_blank" class="btn-a" style="border-color:#25d366;color:#25d366;">💬 واتساب</a>
            <a href="https://maps.google.com/?q=${encodeURIComponent(s.delivery_address||'')}" target="_blank" class="btn-a">🗺️ خريطة</a>
          </div>
          <div class="st-g">
            <button type="button" class="btn-s" style="background:var(--s);grid-column:span 2;" onclick="setSt('${s.id}','delivered',${s.cod_amount})">تم التسليم كامل ✓</button>
            <button type="button" class="btn-s" style="background:#8b5cf6;" onclick="opP('${s.id}')">استلام جزئي</button>
            <button type="button" class="btn-s" style="background:#0d9488;" onclick="opShp('${s.id}')">شحن فقط 🚚</button>
            <button type="button" class="btn-s" style="background:var(--w);" onclick="opR('${s.id}')">تأجيل 📅</button>
            <button type="button" class="btn-s" style="background:var(--d);" onclick="setSt('${s.id}','returned',0)">مرتجع ✕</button>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px dashed #334155;padding-top:6px;margin-top:6px;font-size:0.75rem;">
            <span>خط السير</span>
            <div>
              <button type="button" style="background:#334155;border:1px solid #334155;color:#fff;width:30px;height:26px;border-radius:4px;" onclick="mv('${s.id}',-1)">⬆️</button>
              <button type="button" style="background:#334155;border:1px solid #334155;color:#fff;width:30px;height:26px;border-radius:4px;" onclick="mv('${s.id}',1)">⬇️</button>
            </div>
          </div>
          <div class="adm-bar">
            <button type="button" class="btn-adm" style="background:#0284c7;" onclick="opTr('${s.id}')">🔄 تحويل لمندوب</button>
            <button type="button" class="btn-adm" style="background:#b91c1c;" onclick="delS('${s.id}')">🗑️ حذف</button>
          </div>
        </div>`;
      });

      document.getElementById('lst').innerHTML = h || '<p style="text-align:center;color:var(--m);margin-top:20px;">لا توجد شحنات.</p>';
      document.getElementById('kC').innerText = done;
      document.getElementById('kM').innerText = money + ' ج.م';
    }

    function setSt(id, st, amt, extra={}){
      const it = raw.find(x => String(x.id) === String(id));
      if(it){
        it.status = st;
        it.collected_amount = amt;
        Object.assign(it, extra);
        localStorage.setItem('am_active_orders_clean', JSON.stringify(raw));
        rnd();
      }
    }

    function opShp(id){
      actId = id;
      document.getElementById('shpId').value = id;
      document.getElementById('shpAmt').value = 75;
      opM('mShp');
    }
    function svShp(){
      const amt = Number(document.getElementById('shpAmt').value) || 0;
      clsM('mShp');
      setSt(actId, 'shipping_only', amt);
    }

    function opP(id){
      actId = id;
      document.getElementById('pI').value = id;
      document.getElementById('pA').value = '';
      opM('mP');
    }
    function svP(){
      const a = Number(document.getElementById('pA').value);
      if(isNaN(a) || a < 0) return alert('مبلغ غير صحيح');
      clsM('mP');
      setSt(actId, 'partial', a);
    }

    function opR(id){
      actId = id;
      document.getElementById('rI').value = id;
      document.getElementById('rD').value = '';
      opM('mR');
    }
    function svR(){
      const d = document.getElementById('rD').value;
      if(!d) return alert('حدد التاريخ');
      clsM('mR');
      setSt(actId, 'rescheduled', 0, {rescheduled_date: d});
    }

    function opTr(id){
      actId = id;
      document.getElementById('trId').value = id;
      opM('mTr');
    }
    function svTr(){
      const c = document.getElementById('trCourier').value;
      const it = raw.find(x => String(x.id) === String(actId));
      if(it){
        it.courier_id = c;
        localStorage.setItem('am_active_orders_clean', JSON.stringify(raw));
        alert('تم تحويل الشحنة بنجاح!');
      }
      clsM('mTr');
      rnd();
    }

    function delS(id){
      if(!confirm('هل تريد حذف هذه الشحنة؟')) return;
      raw = raw.filter(x => String(x.id) !== String(id));
      localStorage.setItem('am_active_orders_clean', JSON.stringify(raw));
      rnd();
    }

    function mv(id, dir){
      const i = raw.findIndex(x => String(x.id) === String(id));
      if(i < 0 || i + dir < 0 || i + dir >= raw.length) return;
      const it = raw.splice(i, 1)[0];
      raw.splice(i + dir, 0, it);
      localStorage.setItem('am_active_orders_clean', JSON.stringify(raw));
      rnd();
    }

    async function doScan(input){
      if(!input.files || !input.files[0]) return;
      const file = input.files[0];
      if('BarcodeDetector' in window){
        try{
          const detector = new BarcodeDetector({formats: ['code_128', 'code_39', 'ean_13', 'qr_code']});
          const img = await createImageBitmap(file);
          const barcodes = await detector.detect(img);
          if(barcodes.length > 0){
            document.getElementById('q').value = barcodes[0].rawValue.trim();
            rnd();
            return;
          }
        }catch(e){}
      }
      const c = prompt('أدخل كود الشحنة للبحث:');
      if(c){ document.getElementById('q').value = c.trim(); rnd(); }
    }

    function opLoc(){
      if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(p => {
          document.getElementById('locBody').innerHTML = `<p style="margin-bottom:8px;">موقع المندوب أحمد متصل:</p><a href="https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}" target="_blank" style="color:#25d366;text-decoration:none;">🗺️ فتح خرائط جوجل</a>`;
          opM('mLoc');
        }, () => { alert('يرجى تفعيل GPS على الهاتف أولاً.'); });
      }
    }

    function lgn(){
      const v = document.getElementById('lU').value;
      document.getElementById('uN').innerText = (v==='admin'?'👑 المدير':'🚴 '+v);
      document.getElementById('cF').value = (v==='admin'?'all':v);
      clsM('mL'); rnd();
    }

    function addC(){
      const n = document.getElementById('ncN').value.trim();
      if(!n) return;
      const opt = document.createElement('option');
      opt.value = n; opt.text = n;
      document.getElementById('cF').add(opt);
      document.getElementById('cL').innerHTML += `<div>🚴 ${n}</div>`;
      document.getElementById('ncN').value = '';
    }

    function upX(){
      const fi = document.getElementById('xf');
      if(!fi.files.length) return alert('اختر ملف CSV أولاً');
      const f = fi.files[0], cid = document.getElementById('xCr').value;
      const rd = new FileReader();
      rd.onload = function(e){
        const rows = e.target.result.split(/\r?\n/).filter(r=>r.trim());
        let count = 0;
        for(let i=1; i<rows.length; i++){
          const c = rows[i].split(',');
          if(c.length >= 4){
            raw.push({
              id: 'imp-'+Date.now()+'-'+i,
              tracking_code: c[0].replace(/["']/g,'').trim(),
              recipient_name: c[1].replace(/["']/g,'').trim(),
              recipient_phone: c[2].replace(/["']/g,'').trim(),
              delivery_address: c[3].replace(/["']/g,'').trim(),
              cod_amount: Number(c[4]) || 0,
              courier_id: cid,
              status: 'out_for_delivery',
              collected_amount: 0
            });
            count++;
          }
