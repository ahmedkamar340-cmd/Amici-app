<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>أميتشي للشحن والتوصيل</title>
  <meta name="theme-color" content="#1e293b">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #2563eb;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --purple: #8b5cf6;
      --whatsapp: #25d366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }
    
    header { background: var(--card); padding: 12px 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .header-top h1 { font-size: 1.05rem; font-weight: bold; color: #38bdf8; }

    .header-buttons { display: flex; gap: 6px; }
    .btn-header { background: #334155; border: 1px solid #475569; color: #fff; padding: 6px 9px; border-radius: 8px; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
    .btn-scan { background: #0284c7; border-color: #38bdf8; }
    .btn-couriers { background: #475569; border-color: #64748b; }

    .search-bar-box { display: flex; gap: 8px; margin-bottom: 10px; }
    .search-input { flex: 1; background: #0f172a; color: #fff; border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; outline: none; }

    .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .selector-box { background: rgba(0,0,0,0.25); padding: 6px 10px; border-radius: 10px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
    .selector-box label { font-size: 0.75rem; color: var(--text-muted); }
    .custom-select, .custom-date { background: #0f172a; color: #fff; border: 1px solid var(--border); padding: 6px 8px; border-radius: 6px; font-size: 0.8rem; width: 100%; outline: none; }

    .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 16px; }
    .kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px; text-align: center; }
    .kpi-card .val { font-size: 1.3rem; font-weight: 800; color: #38bdf8; }
    .kpi-card .lbl { font-size: 0.75rem; color: var(--text-muted); margin-top: 3px; }

    .shipments-container { padding: 0 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); }
    
    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .code-wrap { display: flex; align-items: center; gap: 8px; }
    .order-rank { background: #334155; color: #38bdf8; font-size: 0.75rem; font-weight: bold; width: 22px; height: 22px; display: inline-flex; justify-content: center; align-items: center; border-radius: 50%; }
    .code { font-weight: bold; font-size: 0.95rem; color: #38bdf8; }
    
    .status-tag { font-size: 0.75rem; padding: 3px 8px; border-radius: 6px; font-weight: 600; }
    .status-out_for_delivery { background: #1e3a8a; color: #93c5fd; }
    .status-delivered { background: #14532d; color: #86efac; }
    .status-partial { background: #581c87; color: #e9d5ff; }
    .status-shipping_only { background: #065f46; color: #a7f3d0; }
    .status-rescheduled { background: #78350f; color: #fde68a; }
    .status-returned { background: #7f1d1d; color: #fca5a5; }
    
    .recipient-name { font-size: 1.05rem; font-weight: 600; margin-bottom: 4px; }
    .address { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; margin-bottom: 6px; }
    
    .financials { background: rgba(0,0,0,0.25); border-radius: 8px; padding: 8px 12px; display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.88rem; }
    .amount { font-weight: bold; color: #4ade80; }
    .collected-amount { color: #38bdf8; font-weight: bold; }

    .quick-actions { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 6px; margin-bottom: 10px; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 7px 4px; border-radius: 8px; text-decoration: none; text-align: center; font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .btn-whatsapp { background: rgba(37, 211, 102, 0.15); border-color: #25d366; color: #25d366; }

    .reorder-strip { display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed var(--border); padding-top: 8px; margin-top: 8px; }
    .reorder-title { font-size: 0.72rem; color: var(--text-muted); }
    .reorder-btns { display: flex; gap: 6px; }
    .btn-reorder { background: #334155; border: 1px solid var(--border); color: #fff; width: 30px; height: 28px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    .status-actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .btn-act { border: none; padding: 8px 4px; border-radius: 8px; font-weight: 700; font-size: 0.78rem; cursor: pointer; color: #fff; text-align: center; }
    .btn-deliver { background: var(--success); grid-column: span 2; padding: 10px 4px; font-size: 0.85rem; }
    .btn-partial { background: var(--purple); }
    .btn-shipping-only { background: #0d9488; }
    .btn-reschedule { background: var(--warning); }
    .btn-return { background: var(--danger); }

    .settlement-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 40; }
    .btn-settle { background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 10px; font-weight: bold; cursor: pointer; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; padding: 16px; }
    .modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 440px; padding: 18px; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-size: 1.05rem; font-weight: bold; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .btn-close-modal { background: transparent; border: none; color: var(--text-muted); font-size: 1.3rem; cursor: pointer; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
    .form-control { width: 100%; background: #0f172a; color: #fff; border: 1px solid var(--border); padding: 8px 10px; border-radius: 8px; font-size: 0.85rem; outline: none; }
    .btn-modal-action { background: var(--primary); color: white; width: 100%; padding: 11px; border-radius: 10px; border: none; font-size: 0.92rem; font-weight: bold; cursor: pointer; }
    .badge-notice { background: rgba(56, 189, 248, 0.15); border: 1px solid #38bdf8; color: #38bdf8; padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; margin-bottom: 12px; line-height: 1.4; }
    .courier-list-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.25); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; }
    .btn-del-courier { background: #7f1d1d; border: 1px solid #ef4444; color: #fff; border-radius: 6px; padding: 4px 8px; font-size: 0.75rem; cursor: pointer; }
    #scannerRegion { width: 100%; border-radius: 12px; overflow: hidden; background: #000; min-height: 250px; }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <h1>أميتشي إكسبريس</h1>
      <div class="header-buttons">
        <button class="btn-header btn-couriers" onclick="promptAdminAccess('couriers')">👥 المناديب</button>
        <button class="btn-header btn-scan" onclick="openScannerModal()">📷 باركود</button>
      </div>
    </div>

    <div class="search-bar-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 بحث بكود الشحنة، الاسم، أو الهاتف..." oninput="filterAndRender()">
    </div>

    <div class="filter-grid">
      <div class="selector-box">
        <label for="courierFilter">👤 المندوب:</label>
        <select id="courierFilter" class="custom-select" onchange="loadShipments()">
          <option value="all">عرض كل المناديب</option>
          <option value="a0000000-0000-0000-0000-000000000004">مينا عبد النور</option>
          <option value="a0000000-0000-0000-0000-000000000001">أحمد</option>
          <option value="a0000000-0000-0000-0000-000000000002">محمد محمود (العجمي)</option>
          <option value="a0000000-0000-0000-0000-000000000003">إسلام فتحي (شرق)</option>
        </select>
      </div>

      <div class="selector-box">
        <label for="dateFilter">📅 تصفية بالتاريخ (اختياري):</label>
        <input type="date" id="dateFilter" class="custom-date" onchange="filterAndRender()">
      </div>
    </div>
  </header>

  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="val" id="kpiDelivered">0</div>
      <div class="lbl">شحنات منجزة</div>
    </div>
    <div class="kpi-card">
      <div class="val" id="kpiCash">0 ج.م</div>
      <div class="lbl">نقدية محصلة (COD)</div>
    </div>
  </div>

  <div class="shipments-container" id="shipmentsList">
    <p style="text-align: center; color: var(--text-muted); margin-top: 20px;">جارٍ جلب الشحنات من السيرفر...</p>
  </div>

  <div class="settlement-bar">
    <div>
      <div style="font-size: 0.75rem; color: var(--text-muted);">صافي النقد المحصل في العهدة</div>
      <div style="font-weight: bold; color: #4ade80;" id="settleCashBottom">0 ج.م</div>
    </div>
    <button class="btn-settle" onclick="requestSettlement()">تصفية الوردية 💰</button>
  </div>

  <!-- نافذة طلب رمز PIN للمدير -->
  <div class="modal-overlay" id="pinModal">
    <div class="modal-box">
      <div class="modal-title">
        <span>🔐 تأكيد هوية المدير</span>
        <button class="btn-close-modal" onclick="closeModal('pinModal')">✕</button>
      </div>
      <div class="badge-notice">أدخل رمز الأمان للمدير (الافتراضي: 1234):</div>
      <div class="form-group">
        <input type="password" id="adminPinInput" class="form-control" placeholder="****" maxlength="8">
      </div>
      <button class="btn-modal-action" onclick="verifyPinAndProceed()">تأكيد الدخول</button>
    </div>
  </div>

  <!-- نافذة إدارة المناديب -->
  <div class="modal-overlay" id="couriersModal">
    <div class="modal-box">
      <div class="modal-title">
        <span>👥 إدارة المناديب</span>
        <button class="btn-close-modal" onclick="closeModal('couriersModal')">✕</button>
      </div>
      
      <div style="display:flex; gap:6px; margin-bottom:15px;">
        <input type="text" id="newCourierNameInput" class="form-control" placeholder="اسم المندوب ومناطقه">
        <button class="btn-modal-action" style="width: auto; padding: 0 14px; background: var(--success);" onclick="addNewCourier()">+ إضافة</button>
      </div>

      <div id="couriersListContainer" style="max-height: 200px; overflow-y: auto; margin-bottom: 12px;"></div>
    </div>
  </div>

  <!-- نافذة الباركود -->
  <div class="modal-overlay" id="scannerModal">
    <div class="modal-box">
      <div class="modal-title">
        <span>📷 مسح باركود الشحنة</span>
        <button class="btn-close-modal" onclick="closeScannerModal()">✕</button>
      </div>
      <div id="scannerRegion"></div>
    </div>
  </div>

  <!-- استلام جزئي -->
  <div class="modal-overlay" id="partialModal">
    <div class="modal-box">
      <div class="modal-title">
        <span>📦 استلام جزئي للشحنة</span>
        <button class="btn-close-modal" onclick="closeModal('partialModal')">✕</button>
      </div>
      <input type="hidden" id="partialShipmentId">
      <div class="form-group">
        <label>💵 المبلغ المحصل الفعلي (ج.م):</label>
        <input type="number" id="partialAmountInput" class="form-control" style="font-size: 1.1rem; color: #4ade80; font-weight: bold;">
      </div>
      <button class="btn-modal-action" style="background: var(--purple);" onclick="submitPartial()">✓ تأكيد الاستلام الجزئي</button>
    </div>
  </div>

  <!-- دفع الشحن فقط -->
  <div class="modal-overlay" id="shippingOnlyModal">
    <div class="modal-box">
      <div class="modal-title">
        <span>🚚 رفض ودفع مصاريف الشحن</span>
        <button class="btn-close-modal" onclick="closeModal('shippingOnlyModal')">✕</button>
      </div>
      <input type="hidden" id="shippingOnlyId">
      <div class="form-group">
        <label>💵 قيمة مصاريف الشحن المحصلة (ج.م):</label>
        <input type="number" id="shippingFeeInput" class="form-control" style="font-size: 1.1rem; color: #38bdf8; font-weight: bold;">
      </div>
      <button class="btn-modal-action" style="background: #0d9488;" onclick="submitShippingOnly()">✓ تأكيد تحصيل الشحن</button>
    </div>
  </div>

  <!-- تأجيل بموعد -->
  <div class="modal-overlay" id="rescheduleModal">
    <div class="modal-box">
      <div class="modal-title">
        <span>📅 تأجيل موعد التسليم</span>
        <button class="btn-close-modal" onclick="closeModal('rescheduleModal')">✕</button>
      </div>
      <input type="hidden" id="rescheduleShipmentId">
      <div class="form-group">
        <label>📆 تاريخ التسليم الجديد:</label>
        <input type="date" id="rescheduleDateInput" class="custom-date">
      </div>
      <button class="btn-modal-action" style="background: var(--warning);" onclick="submitReschedule()">✓ حفظ التأجيل</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://difabkjpyypaylnofbcl.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRpZmFia2pweXlwYXlsbm9mYmNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5NzY1OTksImV4cCI6MjEwOTU1MjU5OX0.THAtRh72IfpKvbXxaRK6X9mlWDlkLFjKG6O5DdROZEQ';
    
    let supabaseClient = null;
    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch(e) {}

    const DEFAULT_COURIERS = [
      { id: "a0000000-0000-0000-0000-000000000004", name: "مينا عبد النور" },
      { id: "a0000000-0000-0000-0000-000000000001", name: "أحمد" },
      { id: "a0000000-0000-0000-0000-000000000002", name: "محمد محمود (العجمي)" },
      { id: "a0000000-0000-0000-0000-000000000003", name: "إسلام فتحي (شرق)" }
    ];

    function getCouriers() {
      try {
        const stored = localStorage.getItem('amici_custom_couriers');
        if (stored) return JSON.parse(stored);
      } catch(e) {}
      return DEFAULT_COURIERS;
    }

    function saveCouriers(list) {
      localStorage.setItem('amici_custom_couriers', JSON.stringify(list));
      populateCouriersSelects();
    }

    function promptAdminAccess(action) {
      document.getElementById('adminPinInput').value = '';
      document.getElementById('pinModal').style.display = 'flex';
      setTimeout(() => document.getElementById('adminPinInput').focus(), 150);
    }

    function verifyPinAndProceed() {
      const pin = document.getElementById('adminPinInput').value.trim();
      const savedPin = localStorage.getItem('amici_admin_pin') || '1234';
      if (pin === savedPin) {
        closeModal('pinModal');
        populateCouriersSelects();
        document.getElementById('couriersModal').style.display = 'flex';
      } else {
        alert('رمز PIN غير صحيح!');
      }
    }

    function populateCouriersSelects() {
      const couriers = getCouriers();
      const filterSelect = document.getElementById('courierFilter');
      if (filterSelect) {
        const current = filterSelect.value || 'all';
        let html = '<option value="all">عرض كل المناديب</option>';
        couriers.forEach(c => {
          html += `<option value="${c.id}">${c.name}</option>`;
        });
        filterSelect.innerHTML = html;
        filterSelect.value = current;
      }

      const listContainer = document.getElementById('couriersListContainer');
      if (listContainer) {
        let html = '';
        couriers.forEach(c => {
          html += `
            <div class="courier-list-item">
              <span style="font-size:0.85rem; font-weight:600;">👤 ${c.name}</span>
              <button class="btn-del-courier" onclick="deleteCourier('${c.id}')">حذف 🗑️</button>
            </div>
          `;
        });
        listContainer.innerHTML = html;
      }
    }

    function addNewCourier() {
      const nameInput = document.getElementById('newCourierNameInput');
      const name = nameInput.value.trim();
      if (!name) return alert('يرجى كتابة اسم المندوب.');

      const couriers = getCouriers();
      const newId = 'c-' + Date.now();
      couriers.push({ id: newId, name: name });
      saveCouriers(couriers);
      nameInput.value = '';
      alert(`تمت إضافة المندوب (${name}) بنجاح!`);
    }

    function deleteCourier(id) {
      let couriers = getCouriers();
      const target = couriers.find(c => c.id === id);
      const name = target ? target.name : 'هذا المندوب';
      if (!confirm(`هل أنت متأكد من حذف ${name}؟`)) return;

      couriers = couriers.filter(c => c.id !== id);
      saveCouriers(couriers);
    }

    let rawShipmentsData = [];
    let displayedShipments = [];
    let html5QrScanner = null;

    function closeModal(id) {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    }

    function formatPhoneForWhatsApp(phone) {
      if (!phone) return '';
      let clean = String(phone).replace(/[^0-9]/g, '');
      if (clean.startsWith('01')) clean = '2' + clean;
      return clean;
    }

    async function loadShipments() {
      const container = document.getElementById('shipmentsList');
      if (!supabaseClient) {
        if (container) container.innerHTML = '<p style="text-align:center;color:#f87171;margin-top:20px;">تعذر الاتصال بالسيرفر.</p>';
        return;
      }

      try {
        const filterSelect = document.getElementById('courierFilter');
        const selectedCourier = filterSelect ? filterSelect.value : 'all';

        let query = supabaseClient.from('shipments').select('*').order('created_at', { ascending: false });

        if (selectedCourier && selectedCourier !== 'all') {
          query = query.eq('courier_id', selectedCourier);
        }

        const { data, error } = await query;
        if (error) {
          if (container) container.innerHTML = `<p style="text-align:center;color:#f87171;margin-top:20px;">خطأ: ${error.message}</p>`;
          return;
        }

        rawShipmentsData = data || [];
        filterAndRender();
      } catch (err) {
        if (container) container.innerHTML = `<p style="text-align:center;color:#f87171;margin-top:20px;">حدث خطأ: ${err.message}</p>`;
      }
    }

    function moveShipment(id, direction) {
      const idx = displayedShipments.findIndex(s => s.id === id);
      if (idx === -1) return;
      const targetIdx = idx + direction;
      if (targetIdx < 0 || targetIdx >= displayedShipments.length) return;

      const item = displayedShipments.splice(idx, 1)[0];
      displayedShipments.splice(targetIdx, 0, item);
      render(id);
    }

    function filterAndRender(highlightId = null) {
      const selectedDate = document.getElementById('dateFilter') ? document.getElementById('dateFilter').value : '';
      const searchEl = document.getElementById('searchInput');
      const searchQuery = searchEl ? searchEl.value.trim().toLowerCase() : '';

      displayedShipments = rawShipmentsData.filter(s => {
        const code = String(s.tracking_code || '').toLowerCase();
        const name = String(s.recipient_name || '').toLowerCase();
        const phone = String(s.recipient_phone || '').toLowerCase();
        const addr = String(s.delivery_address || '').toLowerCase();

        const matchesSearch = !searchQuery || (code.includes(searchQuery) || name.includes(searchQuery) || phone.includes(searchQuery) || addr.includes(searchQuery));
        if (!matchesSearch) return false;

        if (selectedDate && !searchQuery) {
          const itemDate = s.created_at ? s.created_at.substring(0, 10) : '';
          const reschedDate = s.rescheduled_date || '';
          return (itemDate === selectedDate) || (reschedDate === selectedDate);
        }
        return true;
      });

      render(highlightId);
    }

    function render(highlightId = null) {
      const container = document.getElementById('shipmentsList');
      if (!container) return;
      container.innerHTML = '';

      if (!displayedShipments || displayedShipments.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:20px;">لا توجد شحنات مطابقة.</p>';
        document.getElementById('kpiDelivered').innerText = 0;
        document.getElementById('kpiCash').innerText = '0 ج.م';
        document.getElementById('settleCashBottom').innerText = '0 ج.م';
        return;
      }

      let completedCount = 0;
      let totalCash = 0;

      displayedShipments.forEach((shipment, index) => {
        let collectedAmount = 0;
        if (shipment.status === 'delivered') {
          completedCount++;
          collectedAmount = Number(shipment.collected_amount !== undefined && shipment.collected_amount !== null ? shipment.collected_amount : (shipment.cod_amount || 0));
          totalCash += collectedAmount;
        } else if (shipment.status === 'partial' || shipment.status === 'shipping_only') {
          completedCount++;
          collectedAmount = Number(shipment.collected_amount || 0);
          totalCash += collectedAmount;
        }

        const isFinished = ['delivered', 'partial', 'shipping_only'].includes(shipment.status);
        const isHighlighted = shipment.id === highlightId;

        let statusText = 'قيد التوصيل';
        if (shipment.status === 'delivered') statusText = 'تم التسليم بالكامل ✓';
        if (shipment.status === 'partial') statusText = 'استلام جزئي 📦';
        if (shipment.status === 'shipping_only') statusText = 'رفض ودفع الشحن 🚚';
        if (shipment.status === 'rescheduled') statusText = `مؤجل (${shipment.rescheduled_date || 'بدون تاريخ'})`;
        if (shipment.status === 'returned') statusText = 'مرتجع نهائي ✕';

        const waPhone = formatPhoneForWhatsApp(shipment.recipient_phone || '');
        const waMessage = encodeURIComponent(`السلام عليكم أستاذ ${shipment.recipient_name || ''}، معك مندوب شركة أميتشي بخصوص شحنتك رقم (${shipment.tracking_code || ''}) والمطلوب تحصيله (${shipment.cod_amount || 0} ج.م)، برجاء تأكيد ميعاد ومكان التسليم المناسب:`);
        const waLink = waPhone ? `https://wa.me/${waPhone}?text=${waMessage}` : '#';

        const card = document.createElement('div');
        card.id = `shipment-card-${shipment.id}`;
        card.className = `card ${isHighlighted ? 'highlighted-card' : ''}`;
        card.innerHTML = `
          <div class="card-head">
            <div class="code-wrap">
              <span class="order-rank">${index + 1}</span>
              <span class="code">🏷️ ${shipment.tracking_code || 'بدون كود'}</span>
            </div>
            <span class="status-tag status-${shipment.status}">${statusText}</span>
          </div>

          <div class="recipient-name">${shipment.recipient_name || 'بدون اسم'}</div>
          <div class="address">${shipment.delivery_address || ''} ${shipment.delivery_zone ? '(' + shipment.delivery_zone + ')' : ''}</div>

          <div class="financials">
            <span>المطلوب أصلاً: <b style="color:#fff;">${shipment.cod_amount || 0} ج.م</b></span>
            <span>المحصل بالخزينة: <span class="collected-amount">${collectedAmount} ج.م</span></span>
          </div>

          <div class="quick-actions">
            <a href="tel:${shipment.recipient_phone}" class="btn-outline">📞 اتصال</a>
            <a href="${waLink}" target="_blank" class="btn-outline btn-whatsapp" ${!waPhone ? 'onclick="alert(\'رقم هاتف العميل غير متوفر\'); return false;"' : ''}>💬 واتساب</a>
            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(shipment.delivery_address || '')}" target="_blank" class="btn-outline">🗺️ الخريطة</a>
          </div>

          ${!isFinished ? `
          <div class="status-actions-grid">
            <button class="btn-act btn-deliver" onclick="markDelivered('${shipment.id}',${shipment.cod_amount || 0})">تم التسليم كامل ✓</button>
            <button class="btn-act btn-partial" onclick="openPartialModal('${shipment.id}')">استلام جزئي</button>
            <button class="btn-act btn-shipping-only" onclick="openShippingOnlyModal('${shipment.id}')">دفع شحن فقط</button>
            <button class="btn-act btn-reschedule" onclick="openRescheduleModal('${shipment.id}')">تأجيل بموعد 📅</button>
            <button class="btn-act btn-return" onclick="markReturned('${shipment.id}')">رفض تام ✕</button>
          </div>
          ` : `
          <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(0,0,0,0.2); padding:6px 10px; border-radius:8px;">
            <span style="font-size:0.8rem; color:#86efac;">✓ تم إنهاء هذا الأوردر</span>
            <button onclick="reopenShipment('${shipment.id}')" style="background:transparent; border:none; color:var(--text-muted); font-size:0.75rem; text-decoration:underline; cursor:pointer;">تراجع / تعديل</button>
          </div>
          `}

          <div class="reorder-strip">
            <span class="reorder-title">ترتيب خط السير:</span>
            <div class="reorder-btns">
              <button class="btn-reorder" onclick="moveShipment('${shipment.id}', -1)">⬆️</button>
              <button class="btn-reorder" onclick="moveShipment('${shipment.id}', 1)">⬇️</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('kpiDelivered').innerText = completedCount;
      document.getElementById('kpiCash').innerText = totalCash + ' ج.م';
      document.getElementById('settleCashBottom').innerText = totalCash + ' ج.م';
    }

    async function markDelivered(id, totalAmount) {
      await supabaseClient.from('shipments').update({ status: 'delivered' }).eq('id', id);
      loadShipments();
    }

    function openPartialModal(id) {
      document.getElementById('partialShipmentId').value = id;
      document.getElementById('partialAmountInput').value = '';
      document.getElementById('partialModal').style.display = 'flex';
    }

    async function submitPartial() {
      const id = document.getElementById('partialShipmentId').value;
      const amt = Number(document.getElementById('partialAmountInput').value);
      if (isNaN(amt) || amt < 0) return alert('يرجى إدخال المبلغ بشكل صحيح.');

      await supabaseClient.from('shipments').update({ status: 'partial' }).eq('id', id);
      closeModal('partialModal');
      loadShipments();
    }

    function openShippingOnlyModal(id) {
      document.getElementById('shippingOnlyId').value = id;
      document.getElementById('shippingFeeInput').value = 75;
      document.getElementById('shippingOnlyModal').style.display = 'flex';
    }

    async function submitShippingOnly() {
      const id = document.getElementById('shippingOnlyId').value;
      await supabaseClient.from('shipments').update({ status: 'shipping_only' }).eq('id', id);
      closeModal('shippingOnlyModal');
      loadShipments();
    }

    function openRescheduleModal(id) {
      document.getElementById('rescheduleShipmentId').value = id;
      document.getElementById('rescheduleModal').style.display = 'flex';
    }

    async function submitReschedule() {
      const id = document.getElementById('rescheduleShipmentId').value;
      const newDate = document.getElementById('rescheduleDateInput').value;
      if (!newDate) return alert('يرجى تحديد تاريخ جديد.');

      await supabaseClient.from('shipments').update({ status: 'rescheduled' }).eq('id', id);
      closeModal('rescheduleModal');
      loadShipments();
    }

    async function markReturned(id) {
      if (!confirm('تسجيل الطرد كمرتجع نهائي؟')) return;
      await supabaseClient.from('shipments').update({ status: 'returned' }).eq('id', id);
      loadShipments();
    }

    async function reopenShipment(id) {
      await supabaseClient.from('shipments').update({ status: 'out_for_delivery' }).eq('id', id);
      loadShipments();
    }
