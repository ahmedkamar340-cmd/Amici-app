<html lang="ar" dir="rtl">

  <style>
    :root { --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #f8fafc; --muted: #94a3b8; --primary: #38bdf8; --success: #16a34a; --warning: #d97706; --danger: #dc2626; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 90px; }
    header { background: var(--card); padding: 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .btn-group { display: flex; gap: 5px; }
    .btn-h { background: #334155; border: 1px solid #475569; color: #fff; padding: 6px 9px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
    .s-in { width: 100%; background: #0f172a; color: #fff; border: 1px solid var(--border); padding: 8px 10px; border-radius: 6px; font-size: 0.85rem; outline: none; margin-bottom: 8px; }
    .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .filter-box { background: rgba(0,0,0,0.25); padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); }
    .filter-box label { font-size: 0.7rem; color: var(--muted); display: block; margin-bottom: 2px; }
    .c-in { width: 100%; background: #0f172a; color: #fff; border: 1px solid var(--border); padding: 6px; border-radius: 4px; font-size: 0.8rem; outline: none; }
    .kpi-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 14px; }
    .kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px; text-align: center; }
    .kpi-val { font-size: 1.15rem; font-weight: bold; color: var(--primary); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin: 10px 14px; }
    .card-top { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 4px; }
    .card-title { font-size: 0.95rem; font-weight: 600; }
    .card-addr { font-size: 0.78rem; color: var(--muted); margin: 3px 0 6px 0; }
    .card-fin { display: flex; justify-content: space-between; background: rgba(0,0,0,0.25); padding: 5px 8px; border-radius: 4px; margin-bottom: 8px; font-size: 0.82rem; }
    .acts-grid { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 5px; margin-bottom: 8px; }
    .btn-act { background: transparent; border: 1px solid var(--border); color: #fff; padding: 6px 0; border-radius: 6px; text-decoration: none; text-align: center; font-size: 0.75rem; font-weight: bold; }
    .btn-wa { background: rgba(37,211,102,0.15); border-color: #25d366; color: #25d366; }
    .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .btn-status { border: none; padding: 8px; border-radius: 6px; font-weight: bold; font-size: 0.74rem; cursor: pointer; color: #fff; }
    .reorder { display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed var(--border); padding-top: 6px; margin-top: 8px; font-size: 0.75rem; color: var(--muted); }
    .btn-arrow { background: #334155; border: 1px solid var(--border); color: #fff; width: 32px; height: 28px; border-radius: 4px; cursor: pointer; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; padding: 14px; }
