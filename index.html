<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>أميتشي إكسبريس - السحابي</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root{--bg:#0f172a;--c:#1e293b;--b:#334155;--m:#94a3b8;--s:#16a34a;--w:#d97706;--d:#dc2626;}
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;}
    body{background:var(--bg);color:#f8fafc;padding-bottom:85px;}
    header{background:var(--c);padding:10px;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:50;}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
    .btns{display:flex;gap:4px;overflow-x:auto;}
    .btn-h{background:#334155;border:1px solid #475569;color:#fff;padding:6px 9px;border-radius:5px;font-size:0.75rem;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;}
    .s-in{width:100%;background:#0f172a;color:#fff;border:1px solid var(--b);padding:7px;border-radius:6px;font-size:0.8rem;outline:none;margin-bottom:6px;}
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
    .sel-b{background:rgba(0,0,0,0.25);padding:5px;border-radius:6px;border:1px solid var(--b);}
    .c-in{width:100%;background:#0f172a;color:#fff;border:1px solid var(--b);padding:5px;border-radius:4px;font-size:0.75rem;outline:none;}
    .kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px;margin-top:4px;}
    .kpi-b{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:8px;text-align:center;}
    .card{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:10px;margin:8px 10px;}
    .acts{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:4px;margin:6px 0;}
    .btn-a{background:transparent;border:1px solid var(--b);color:#fff;padding:5px;border-radius:5px;text-decoration:none;text-align:center;font-size:0.75rem;font-weight:bold;}
    .st-g{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
    .btn-s{border:none;padding:8px;border-radius:5px;font-weight:bold;font-size:0.75rem;cursor:pointer;color:#fff;}
    .adm-bar{display:flex;gap:4px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--b);}
    .btn-adm{flex:1;background:#334155;border:1px solid var(--b);color:#fff;padding:5px;border-radius:4px;font-size:0.72rem;cursor:pointer;}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;justify-content:center;align-items:center;padding:12px;}
    .m-box{background:var(--c);border:1px solid var(--b);border-radius:8px;width:100%;max-width:340px;padding:12px;}
  </style>
</head>
<body>
  <header>
    <div class="top">
      <h1 style="font-size:0.95rem;color:#38bdf8;">أميتشي <span id="syncStatus" style="font-size:0.65rem;color:#eab308;">⏳ جاري الاتصال...</span></h1>
      <div class="btns">
        <label class="btn-h" style="background:#0284c7;margin:0;">
          📷 باركود
          <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="doScan(this)">
        </label>
        <button type="button" class="btn-h" style="background:#059669;" id="btnXls" onclick="openM('mX')">📁 شيت</button>
        <button type="button" class="btn-h" style="background:#0284c7;" onclick="fetchShipments()">🔄 تحديث</button>
        <button type="button" class="btn-h" onclick="openM('mL')">👤 حساب</button>
      </div>
    </div>
    <input type="text" id="q" class="s-in" placeholder="🔍 بحث بالشحنة أو الاسم أو الهاتف..." oninput="renderList()">
    <div class="g2">
      <div class="sel-b">
        <label style="font-size:0.65rem;color:var(--m);">المندوب:</label>
        <select id="cF" class="c-in" onchange="renderList()">
          <option value="all" selected>عرض كل المناديب</option>
          <option value="ahmed">أحمد</option>
          <option value="biko">بيكو</option>
          <option value="mina">مينا عبد النور</option>
        </select>
      </div>
      <div class="sel-b">
        <label style="font-size:0.65rem;color:var(--m);">الحساب الحالي:</label>
        <div id="uN" style="font-size:0.75rem;padding:4px;font-weight:bold;color:#38bdf8;">👑 المدير</div>
      </div>
    </div>
  </header>

  <div class="kpi">
    <div class="kpi-b"><div id="kC" style="font-size:1.15rem;font-weight:bold;color:#38bdf8;">0</div><div style="font-size:0.7rem;color:var(--m);">منجزة</div></div>
    <div class="kpi-b"><div id="kM" style="font-size:1.15rem;font-weight:bold;color:#38bdf8;">0 ج.م</div><div style="font-size:0.7rem;color:var(--m);">محصل</div></div>
  </div>

  <div id="lst"><p style="text-align:center;color:var(--m);margin-top:30px;">جاري تحميل الشحنات من السحابة...</p></div>

  <!-- نافذة شحن فقط -->
  <div class="modal" id="mShp">
    <div class="m-box">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>🚚 تحصيل شحن فقط</b><span style="cursor:pointer;" onclick="closeM('mShp')">✕</span></div>
      <input type="hidden" id="shpId">
      <label style="font-size:0.75rem;color:var(--m);">مبلغ الشحن المطلوب:</label>
      <input type="number" id="shpAmt" class="c-in" value="75" style="margin:6px 0 10px;">
      <button type="button" class="btn-s" style="background:#0d9488;width:100%;" onclick="confirmShp()">تأكيد وحفظ بالسحابة</button>
    </div>
  </div>

  <!-- نافذة استلام جزئي -->
  <div class="modal" id="mP">
    <div class="m-box">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>📦 استلام جزئي</b><span style="cursor:pointer;" onclick="closeM('mP')">✕</span></div>
      <input type="hidden" id="pId">
      <label style="font-size:0.75rem;color:var(--m);">المبلغ الفعلي المستلم:</label>
      <input type="number" id="pAmt" class="c-in" placeholder="المبلغ المستلم" style="margin:6px 0 10px;">
      <button type="button" class="btn-s" style="background:#8b5cf6;width:100%;" onclick="confirmP()">تأكيد المبلغ</button>
    </div>
  </div>

  <!-- نافذة تأجيل -->
  <div class="modal" id="mR">
    <div class="m-box">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>📅 تأجيل الشحنة</b><span style="cursor:pointer;" onclick="closeM('mR')">✕</span></div>
      <input type="hidden" id="rId">
      <label style="font-size:0.75rem;color:var(--m);">تأجيل إلى يوم:</label>
      <input type="date" id="rDate" class="c-in" style="margin:6px 0 10px;">
      <button type="button" class="btn-s" style="background:var(--w);width:100%;" onclick="confirmR()">حفظ التأجيل</button>
    </div>
  </div>

  <!-- نافذة رفع شيت Excel أو CSV -->
  <div class="modal" id="mX">
    <div class="m-box">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>📁 رفع شيت (Excel / CSV)</b><span style="cursor:pointer;" onclick="closeM('mX')">✕</span></div>
      <label style="font-size:0.7rem;color:var(--m);">تخصيص للمندوب:</label>
      <select id="csvCourier" class="c-in" style="margin-bottom:8px;">
        <option value="ahmed">أحمد</option>
        <option value="biko">بيكو</option>
        <option value="mina">مينا عبد النور</option>
      </select>
      <input type="file" id="csvFile" accept=".xlsx,.xls,.csv,.txt" class="c-in" style="margin-bottom:8px;">
      <button type="button" class="btn-s" style="background:var(--s);width:100%;" onclick="uploadSheetToCloud()">رفع وتوزيع فوري ⬆️</button>
    </div>
  </div>

  <!-- نافذة تبديل الحساب -->
  <div class="modal" id="mL">
    <div class="m-box">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>🔐 تبديل الحساب</b><span style="cursor:pointer;" onclick="closeM('mL')">✕</span></div>
      <select id="roleSel" class="c-in" style="margin-bottom:10px;">
        <option value="admin">👑 المدير</option>
        <option value="ahmed">🚴 أحمد</option>
        <option value="biko">🚴 بيكو</option>
        <option value="mina">🚴 مينا عبد النور</option>
      </select>
      <button type="button" class="btn-s" style="background:#2563eb;width:100%;" onclick="switchRole()">دخول</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://difabkjpyypaylnofbcl.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRpZmFia2pweXlwYXlsbm9mYmNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5NzY1OTksImV4cCI6MjEwOTU1MjU5OX0.THAtRh72IfpKvbXxaRK6X9mlWDlkLFjKG6O5DdROZEQ';

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let allOrders = [];
    let currentRole = 'admin';

    function openM(id){ document.getElementById(id).style.display = 'flex'; }
    function closeM(id){ document.getElementById(id).style.display = 'none'; }

    function safeStr(val) {
      return String(val ?? '').replace(/[\u0000-\u001F\u007F-\u009F\uFFFD\\]/g, '').trim();
    }

    async function fetchShipments() {
      const stEl = document.getElementById('syncStatus');
      stEl.style.color = '#eab308';
      stEl.innerText = '⏳ مزامنة...';

      const { data, error } = await db.from('shipments').select('*').order('id', { ascending: true });
      if (error) {
        stEl.style.color = '#ef4444';
        stEl.innerText = '❌ خطأ اتصال';
        return;
      }

      allOrders = data || [];
      stEl.style.color = '#22c55e';
      stEl.innerText = '● متصل لحظياً';
      renderList();
    }

    async function updateCloudOrder(id, updates) {
      document.getElementById('syncStatus').innerText = '⏳ حفظ...';
      const { error } = await db.from('shipments').update(updates).eq('id', id);
      if (error) alert('فشل الحفظ: ' + error.message);
      else await fetchShipments();
    }

    async function deleteCloudOrder(id) {
      if (!confirm('حذف هذه الشحنة نهائياً؟')) return;
      await db.from('shipments').delete().eq('id', id);
      await fetchShipments();
    }

    async function addSampleData() {
      const samples = [
        { tracking_code:"7791", recipient_name:"Demyana Botros Zachary", recipient_phone:"01001232790", delivery_address:"الاسكندرية العجمي البيطاش ش مسجد الهدي الاندلس والحجاز عمارة 2", cod_amount:190, collected_amount:190, status:"delivered", courier_id:"ahmed" },
        { tracking_code:"12258", recipient_name:"شروق", recipient_phone:"01059947327", delivery_address:"شارع العوامي خلف مدرسة العجمي النموذجية عمارة سنتر الفيروز", cod_amount:610, collected_amount:0, status:"out_for_delivery", courier_id:"ahmed" },
        { tracking_code:"12282", recipient_name:"فيلوباتير", recipient_phone:"01507992457", delivery_address:"105 ش المكس القباري - اسكندرية", cod_amount:610, collected_amount:0, status:"out_for_delivery", courier_id:"ahmed" }
      ];
      const { error } = await db.from('shipments').insert(samples);
      if (error) alert('خطأ: ' + error.message);
      else await fetchShipments();
    }

    function renderList() {
      const q = (document.getElementById('q').value || '').trim().toLowerCase();
      const cid = document.getElementById('cF').value;

      const filtered = allOrders.filter(s => {
        const matchQ = !q || String(s.tracking_code||'').toLowerCase().includes(q) || String(s.recipient_name||'').toLowerCase().includes(q) || String(s.delivery_address||'').toLowerCase().includes(q) || String(s.recipient_phone||'').includes(q);
        const matchC = (cid === 'all' || s.courier_id === cid);
        return matchQ && matchC;
      });

      let done = 0, money = 0, html = '';
      filtered.forEach((s, idx) => {
        const coll = Number(s.collected_amount || 0);
        if (['delivered', 'shipping_only', 'partial'].includes(s.status)) {
          done++;
          money += coll;
        }

        let badge = s.status === 'delivered' ? 'تم التسليم ✓' :
                    s.status === 'shipping_only' ? `شحن (${coll}ج)` :
                    s.status === 'partial' ? 'استلام جزئي' :
                    s.status === 'rescheduled' ? `مؤجل: ${s.rescheduled_date || ''}` :
                    s.status === 'returned' ? 'مرتجع ✕' : 'قيد التوصيل';

        const ph = String(s.recipient_phone || '').replace(/[^0-9]/g, '');
        const wa = ph ? `https://wa.me/2${ph}?text=${encodeURIComponent('السلام عليكم أستاذ '+s.recipient_name+'، شحنتك رقم ('+s.tracking_code+') والمطلوب '+s.cod_amount+' ج.م')}` : '#';

        html += `
        <div class="card">
          <div style="display:flex;justify-content:space-between;font-weight:bold;margin-bottom:4px;">
            <span style="color:#38bdf8;">#${idx+1} 🏷️ ${s.tracking_code || ''}</span>
            <span style="font-size:0.75rem;padding:2px 6px;border-radius:4px;background:#334155;">${badge}</span>
          </div>
          <div style="font-weight:600;">${s.recipient_name || ''}</div>
          <div style="font-size:0.75rem;color:var(--m);margin:2px 0;">${s.delivery_address || ''}</div>
          <div style="display:flex;justify-content:space-between;background:rgba(0,0,0,0.25);padding:4px 8px;border-radius:4px;margin:6px 0;font-size:0.8rem;">
            <span>المطلوب: <b>${s.cod_amount || 0}ج</b></span>
            <span>المحصل: <b style="color:#38bdf8;">${coll}ج</b></span>
          </div>
          <div class="acts">
            <a href="tel:${s.recipient_phone}" class="btn-a">📞 اتصال</a>
            <a href="${wa}" target="_blank" class="btn-a" style="border-color:#25d366;color:#25d366;">💬 واتساب</a>
            <a href="https://maps.google.com/?q=${encodeURIComponent(s.delivery_address || '')}" target="_blank" class="btn-a">🗺️ خريطة</a>
          </div>
          <div class="st-g">
            <button type="button" class="btn-s" style="background:var(--s);grid-column:span 2;" onclick="updateCloudOrder(${s.id}, {status:'delivered', collected_amount:${s.cod_amount}})">تم التسليم كامل ✓</button>
            <button type="button" class="btn-s" style="background:#8b5cf6;" onclick="openP(${s.id})">استلام جزئي</button>
            <button type="button" class="btn-s" style="background:#0d9488;" onclick="openShp(${s.id})">شحن فقط 🚚</button>
            <button type="button" class="btn-s" style="background:var(--w);" onclick="openR(${s.id})">تأجيل 📅</button>
            <button type="button" class="btn-s" style="background:var(--d);" onclick="updateCloudOrder(${s.id}, {status:'returned', collected_amount:0})">مرتجع ✕</button>
          </div>
          ${currentRole === 'admin' ? `<div class="adm-bar"><button type="button" class="btn-adm" style="background:#b91c1c;" onclick="deleteCloudOrder(${s.id})">🗑️ حذف الشحنة</button></div>
