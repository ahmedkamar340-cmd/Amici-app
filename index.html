<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>أميتشي إكسبريس</title>
  <style>
    :root{--bg:#0f172a;--c:#1e293b;--b:#334155;--m:#94a3b8;--s:#16a34a;--w:#d97706;--d:#dc2626;}
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;}
    body{background:var(--bg);color:#f8fafc;padding-bottom:85px;}
    header{background:var(--c);padding:10px;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:50;}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
    .btns{display:flex;gap:4px;overflow-x:auto;}
    .btn-h{background:#334155;border:1px solid #475569;color:#fff;padding:6px 9px;border-radius:5px;font-size:0.75rem;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;}
    .s-in{width:100%;background:#0f172a;color:#fff;border:1px solid var(--b);padding:7px;border-radius:6px;font-size:0.8rem;outline:none;margin-bottom:6px;}
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
    .sel-b{background:rgba(0,0,0,0.25);padding:5px;border-radius:6px;border:1px solid var(--b);}
    .c-in{width:100%;background:#0f172a;color:#fff;border:1px solid var(--b);padding:5px;border-radius:4px;font-size:0.75rem;outline:none;}
    .kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px;margin-top:4px;}
    .kpi-b{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:8px;text-align:center;}
    .card{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:10px;margin:8px 10px;}
    .acts{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:4px;margin:6px 0;}
    .btn-a{background:transparent;border:1px solid var(--b);color:#fff;padding:5px;border-radius:5px;text-decoration:none;text-align:center;font-size:0.75rem;font-weight:bold;}
    .st-g{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
    .btn-s{border:none;padding:8px;border-radius:5px;font-weight:bold;font-size:0.75rem;cursor:pointer;color:#fff;}
    .adm-bar{display:flex;gap:4px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--b);}
    .btn-adm{flex:1;background:#334155;border:1px solid var(--b);color:#fff;padding:5px;border-radius:4px;font-size:0.72rem;cursor:pointer;}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;justify-content:center;align-items:center;padding:12px;}
    .m-box{background:var(--c);border:1px solid var(--b);border-radius:8px;width:100%;max-width:340px;padding:12px;}
  </style>
</head>
<body>
  <header>
    <div class="top">
      <h1 style="font-size:0.95rem;color:#38bdf8;">أميتشي <span id="syncStatus" style="font-size:0.65rem;color:#eab308;">⏳ اتصال...</span></h1>
      <div class="btns">
        <label class="btn-h" style="background:#0284c7;margin:0;">📷 باركود<input type="file" accept="image/*" capture="environment" style="display:none;" onchange="doScan(this)"></label>
        <button type="button" class="btn-h" style="background:#059669;" id="btnXls" onclick="openM('mX')">📁 شيت</button>
        <button type="button" class="btn-h" style="background:#0284c7;" onclick="fetchShipments()">🔄 تحديث</button>
        <button type="button" class="btn-h" onclick="openM('mL')">👤 حساب</button>
      </div>
    </div>
    <input type="text" id="q" class="s-in" placeholder="🔍 بحث بالشحنة أو الاسم أو الهاتف..." oninput="renderList()">
    <div class="g2">
      <div class="sel-b">
        <label style="font-size:0.65rem;color:var(--m);">المندوب:</label>
        <select id="cF" class="c-in" onchange="renderList()">
          <option value="all" selected>عرض كل المناديب</option>
          <option value="ahmed">أحمد</option>
          <option value="biko">بيكو</option>
          <option value="mina">مينا عبد النور</option>
        </select>
      </div>
      <div class="sel-b">
        <label style="font-size:0.65rem;color:var(--m);">الحساب الحالي:</label>
        <div id="uN" style="font-size:0.75rem;padding:4px;font-weight:bold;color:#38bdf8;">👑 المدير</div>
      </div>
    </div>
  </header>

  <div class="kpi">
    <div class="kpi-b"><div id="kC" style="font-size:1.15rem;font-weight:bold;color:#38bdf8;">0</div><div style="font-size:0.7rem;color:var(--m);">منجزة</div></div>
    <div class="kpi-b"><div id="kM" style="font-size:1.15rem;font-weight:bold;color:#38bdf8;">0 ج.م</div><div style="font-size:0.7rem;color:var(--m);">محصل</div></div>
  </div>

  <div id="lst"><p style="text-align:center;color:var(--m);margin-top:30px;">جاري التحميل...</p></div>

  <div class="modal" id="mShp"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>🚚 تحصيل شحن فقط</b><span style="cursor:pointer;" onclick="closeM('mShp')">✕</span></div><input type="hidden" id="shpId"><input type="number" id="shpAmt" class="c-in" value="75" style="margin:6px 0 10px;"><button type="button" class="btn-s" style="background:#0d9488;width:100%;" onclick="confirmShp()">تأكيد الشحن</button></div></div>
  <div class="modal" id="mP"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>📦 استلام جزئي</b><span style="cursor:pointer;" onclick="closeM('mP')">✕</span></div><input type="hidden" id="pId"><input type="number" id="pAmt" class="c-in" placeholder="المبلغ المستلم" style="margin:6px 0 10px;"><button type="button" class="btn-s" style="background:#8b5cf6;width:100%;" onclick="confirmP()">تأكيد المبلغ</button></div></div>
  <div class="modal" id="mR"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>📅 تأجيل الشحنة</b><span style="cursor:pointer;" onclick="closeM('mR')">✕</span></div><input type="hidden" id="rId"><input type="date" id="rDate" class="c-in" style="margin:6px 0 10px;"><button type="button" class="btn-s" style="background:var(--w);width:100%;" onclick="confirmR()">حفظ التأجيل</button></div></div>
  <div class="modal" id="mX"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>📁 رفع شيت CSV</b><span style="cursor:pointer;" onclick="closeM('mX')">✕</span></div><select id="csvCourier" class="c-in" style="margin-bottom:8px;"><option value="ahmed">أحمد</option><option value="biko">بيكو</option><option value="mina">مينا عبد النور</option></select><input type="file" id="csvFile" accept=".csv,.txt" class="c-in" style="margin-bottom:8px;"><button type="button" class="btn-s" style="background:var(--s);width:100%;" onclick="uploadCSVToCloud()">رفع وتوزيع ⬆️</button></div></div>
  <div class="modal" id="mL"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>🔐 الحساب</b><span style="cursor:pointer;" onclick="closeM('mL')">✕</span></div><select id="roleSel" class="c-in" style="margin-bottom:10px;"><option value="admin">👑 المدير</option><option value="ahmed">🚴 أحمد</option><option value="biko">🚴 بيكو</option><option value="mina">🚴 مينا عبد النور</option></select><button type="button" class="btn-s" style="background:#2563eb;width:100%;" onclick="switchRole()">دخول</button></div></div>

  <script>
    window.onerror = function(msg) {
      document.getElementById('lst').innerHTML = '<div style="color:#f87171;text-align:center;padding:20px;">خطأ برمجي: ' + msg + '</div>';
    };

    const API_URL = 'https://difabkjpyypaylnofbcl.supabase.co/rest/v1/shipments';
    const API_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRpZmFia2pweXlwYXlsbm9mYmNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5NzY1OTksImV4cCI6MjEwOTU1MjU5OX0.THAtRh72IfpKvbXxaRK6X9mlWDlkLFjKG6O5DdROZEQ';
    const HEADERS = { 'apikey': API_KEY, 'Authorization': 'Bearer ' + API_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

    let allOrders = [], currentRole = 'admin';
    function openM(id){ document.getElementById(id).style.display = 'flex'; }
    function closeM(id){ document.getElementById(id).style.display = 'none'; }
    function cleanText(s){ return String(s||'').replace(/[\u0000-\u001F\u007F-\u009F\uFFFD\\]/g,'').replace(/["']/g,'').trim(); }

    async function fetchShipments() {
      const stEl = document.getElementById('syncStatus');
      stEl.style.color = '#eab308'; stEl.innerText = '⏳ مزامنة...';
      try {
        const res = await fetch(API_URL + '?select=*&order=id.asc', { headers: HEADERS });
        if (!res.ok) throw new Error(await res.text());
        allOrders = await res.json();
        stEl.style.color = '#22c55e'; stEl.innerText = '● متصل';
        renderList();
      } catch (err) {
        stEl.style.color = '#ef4444'; stEl.innerText = '❌ خطأ';
        document.getElementById('lst').innerHTML = '<div style="text-align:center;color:#f87171;padding:20px;">فشل الاتصال:<br><small>' + err.message + '</small></div>';
      }
    }

    async function updateCloudOrder(id, updates) {
      document.getElementById('syncStatus').innerText = '⏳ حفظ...';
      const res = await fetch(API_URL + '?id=eq.' + id, { method: 'PATCH', headers: HEADERS, body: JSON.stringify(updates) });
      if (res.ok) await fetchShipments();
    }

    async function deleteCloudOrder(id) {
      if (!confirm('حذف الشحنة؟')) return;
      await fetch(API_URL + '?id=eq.' + id, { method: 'DELETE', headers: HEADERS });
      await fetchShipments();
    }

    async function addSampleData() {
      const samples = [
        { tracking_code:"7791", recipient_name:"Demyana Botros Zachary", recipient_phone:"01001232790", delivery_address:"الاسكندرية العجمي البيطاش ش مسجد الهدي الاندلس والحجاز عمارة 2", cod_amount:190, collected_amount:190, status:"delivered", courier_id:"ahmed" },
        { tracking_code:"12258", recipient_name:"شروق", recipient_phone:"01059947327", delivery_address:"شارع العوامي خلف مدرسة العجمي النموذجية عمارة سنتر الفيروز", cod_amount:610, collected_amount:0, status:"out_for_delivery", courier_id:"ahmed" },
        { tracking_code:"12282", recipient_name:"فيلوباتير", recipient_phone:"01507992457", delivery_address:"105 ش المكس القباري - اسكندرية", cod_amount:610, collected_amount:0, status:"out_for_delivery", courier_id:"ahmed" }
      ];
      await fetch(API_URL, { method: 'POST', headers: HEADERS, body: JSON.stringify(samples) });
      await fetchShipments();
    }

    function renderList() {
      const q = (document.getElementById('q').value || '').trim().toLowerCase();
      const cid = document.getElementById('cF').value;
      const filtered = allOrders.filter(s => {
        const mQ = !q || String(s.tracking_code||'').toLowerCase().includes(q) || String(s.recipient_name||'').toLowerCase().includes(q) || String(s.delivery_address||'').toLowerCase().includes(q) || String(s.recipient_phone||'').includes(q);
        return mQ && (cid === 'all' || s.courier_id === cid);
      });

      let done = 0, money = 0, html = '';
      filtered.forEach((s, idx) => {
        const coll = Number(s.collected_amount || 0);
        if (['delivered', 'shipping_only', 'partial'].includes(s.status)) { done++; money += coll; }
        let badge = s.status === 'delivered' ? 'تم التسليم ✓' : s.status === 'shipping_only' ? 'شحن ('+coll+'ج)' : s.status === 'partial' ? 'استلام جزئي' : s.status === 'rescheduled' ? 'مؤجل: '+(s.rescheduled_date||'') : s.status === 'returned' ? 'مرتجع ✕' : 'قيد التوصيل';
        const ph = String(s.recipient_phone||'').replace(/[^0-9]/g,'');
        const wa = ph ? 'https://wa.me/2'+ph+'?text='+encodeURIComponent('السلام عليكم أستاذ '+s.recipient_name+'، شحنتك ('+s.tracking_code+') مطلوب '+s.cod_amount+' ج.م') : '#';

        html += '<div class="card"><div style="display:flex;justify-content:space-between;font-weight:bold;margin-bottom:4px;"><span style="color:#38bdf8;">#'+(idx+1)+' 🏷️ '+(s.tracking_code||'')+'</span><span style="font-size:0.75rem;padding:2px 6px;border-radius:4px;background:#334155;">'+badge+'</span></div><div style="font-weight:600;">'+(s.recipient_name||'')+'</div><div style="font-size:0.75rem;color:var(--m);margin:2px 0;">'+(s.delivery_address||'')+'</div><div style="display:flex;justify-content:space-between;background:rgba(0,0,0,0.25);padding:4px 8px;border-radius:4px;margin:6px 0;font-size:0.8rem;"><span>المطلوب: <b>'+(s.cod_amount||0)+'ج</b></span><span>المحصل: <b style="color:#38bdf8;">'+coll+'ج</b></span></div><div class="acts"><a href="tel:'+s.recipient_phone+'" class="btn-a">📞 اتصال</a><a href="'+wa+'" target="_blank" class="btn-a" style="border-color:#25d366;color:#25d366;">💬 واتساب</a><a href="https://maps.google.com/?q='+encodeURIComponent(s.delivery_address||'')+'" target="_blank" class="btn-a">🗺️ خريطة</a></div><div class="st-g"><button type="button" class="btn-s" style="background:var(--s);grid-column:span 2;" onclick="updateCloudOrder('+s.id+',{status:\'delivered\',collected_amount:'+s.cod_amount+'})">تم التسليم كامل ✓</button><button type="button" class="btn-s" style="background:#8b5cf6;" onclick="openP('+s.id+')">استلام جزئي</button><button type="button" class="btn-s" style="background:#0d9488;" onclick="openShp('+s.id+')">شحن فقط 🚚</button><button type="button" class="btn-s" style="background:var(--w);" onclick="openR('+s.id+')">تأجيل 📅</button><button type="button" class="btn-s" style="background:var(--d);" onclick="updateCloudOrder('+s.id+',{status:\'returned\',collected_amount:0})">مرتجع ✕</button></div>'+(currentRole==='admin'?'<div class="adm-bar"><button type="button" class="btn-adm" style="background:#b91c1c;" onclick="deleteCloudOrder('+s.id+')">🗑️ حذف</button></div>':'')+'</div>';
      });

      document.getElementById('lst').innerHTML = html || '<div style="text-align:center;color:var(--m);margin-top:30px;padding:15px;"><p style="margin-bottom:12px;">لا توجد شحنات حالياً.</p><button type="button" class="btn-s" style="background:#0284c7;padding:10px 16px;" onclick="addSampleData()">+ إضافة شحنات تجريبية</button></div>';
      document.getElementById('kC').innerText = done;
      document.getElementById('kM').innerText = money + ' ج.م';
    }

    function openShp(id){ document.getElementById('shpId').value = id; openM('mShp'); }
    function confirmShp(){ const id=document.getElementById('shpId').value, amt=Number(document.getElementById('shpAmt').value)||0; closeM('mShp'); updateCloudOrder(id,{status:'shipping_only',collected_amount:amt}); }
    function openP(id){ document.getElementById('pId').value = id; openM('mP'); }
    function confirmP(){ const id=document.getElementById('pId').value, amt=Number(document.getElementById('pAmt').value)||0; closeM('mP'); updateCloudOrder(id,{status:'partial',collected_amount:amt}); }
    function openR(id){ document.getElementById('rId').value = id; openM('mR'); }
    function confirmR(){ const id=document.getElementById('rId').value, d=document.getElementById('rDate').value; closeM('mR'); updateCloudOrder(id,{status:'rescheduled',collected_amount:0,rescheduled_date:d}); }

    function uploadCSVToCloud() {
      const file = document.getElementById('csvFile').files[0];
      if (!file) return alert('اختر ملف CSV أولاً');
      const courier = document.getElementById('csvCourier').value;
      const reader = new FileReader();
      reader.onload = async function(e) {
        let text = new TextDecoder('utf-8').decode(e.target.result);
        if (text.includes('\uFFFD')) text = new TextDecoder('windows-1256').decode(e.target.result);
        const lines = text.split(/\r?\n/).filter(r => r.trim());
        const rows = [];
        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].split(lines[i].includes(';') ? ';' : ',');
          if (cols.length >= 4) rows.push({ tracking_code:cleanText(cols[0]), recipient_name:cleanText(cols[1]), recipient_phone:cleanText(cols[2]), delivery_address:cleanText(cols[3]), cod_amount:Number(cleanText(cols[4]).replace(/[^0-9.]/g,''))||0, courier_id:courier, status:'out_for_delivery', collected_amount:0 });
        }
        if (rows.length) {
          const res = await fetch(API_URL, { method: 'POST', headers: HEADERS, body: JSON.stringify(rows) });
          if (res.ok) { alert('تم رفع ' + rows.length + ' شحنة!'); closeM('mX'); await fetchShipments(); }
          else alert('خطأ: ' + await res.text());
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function switchRole() {
      const r = document.getElementById('roleSel').value, cf = document.getElementById('cF'), bx = document.getElementById('btnXls');
      currentRole = r === 'admin' ? 'admin' : 'courier';
      document.getElementById('uN').innerText = r === 'admin' ? '👑 المدير' : '🚴 ' + r;
      cf.value = r === 'admin' ? 'all' : r; cf.disabled = r !== 'admin'; bx.style.display = r === 'admin' ? 'inline-flex' : 'none';
      closeM('mL'); renderList();
    }

    function doScan(input) {
      if (!input.files || !input.files[0]) return;
      const c = prompt('أدخل كود الشحنة:');
      if (c) { document.getElementById('q').value = c.trim(); renderList(); }
    }

    fetchShipments();
  </script>
</body>
</html>
