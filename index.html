<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>أميتشي إكسبريس</title>
  <style>
    :root{--bg:#0f172a;--c:#1e293b;--b:#334155;--m:#94a3b8;--s:#16a34a;--w:#d97706;--d:#dc2626;}
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif;}
    body{background:var(--bg);color:#f8fafc;padding-bottom:80px;}
    header{background:var(--c);padding:10px;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:10;}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
    .btns{display:flex;gap:4px;overflow-x:auto;}
    .btn-h{background:#334155;border:1px solid #475569;color:#fff;padding:5px 8px;border-radius:5px;font-size:0.75rem;cursor:pointer;white-space:nowrap;}
    .s-in{width:100%;background:#0f172a;color:#fff;border:1px solid var(--b);padding:7px;border-radius:6px;font-size:0.8rem;outline:none;margin-bottom:6px;}
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
    .sel-b{background:rgba(0,0,0,0.25);padding:5px;border-radius:6px;border:1px solid var(--b);}
    .c-in{width:100%;background:#0f172a;color:#fff;border:1px solid var(--b);padding:5px;border-radius:4px;font-size:0.75rem;outline:none;}
    .kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px;}
    .kpi-b{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:6px;text-align:center;}
    .card{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:10px;margin:8px 10px;}
    .acts{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:4px;margin:6px 0;}
    .btn-a{background:transparent;border:1px solid var(--b);color:#fff;padding:5px;border-radius:5px;text-decoration:none;text-align:center;font-size:0.75rem;font-weight:bold;}
    .st-g{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
    .btn-s{border:none;padding:7px;border-radius:5px;font-weight:bold;font-size:0.75rem;cursor:pointer;color:#fff;}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:99;justify-content:center;align-items:center;padding:12px;}
    .m-box{background:var(--c);border:1px solid var(--b);border-radius:8px;width:100%;max-width:340px;padding:12px;}
  </style>
</head>
<body>
  <header>
    <div class="top">
      <h1 style="font-size:0.95rem;color:#38bdf8;">أميتشي <span id="uN" style="font-size:0.75rem;color:#fff;">👑 المدير</span></h1>
      <div class="btns">
        <button class="btn-h" style="background:#0284c7;" onclick="opScan()">📷 باركود</button>
        <button class="btn-h" style="background:#0284c7;" onclick="opLoc()">📍 المناديب</button>
        <button class="btn-h" onclick="opL()">🔄 حساب</button>
      </div>
    </div>
    <input type="text" id="q" class="s-in" placeholder="🔍 بحث بالشحنة أو الاسم..." oninput="rnd()">
    <div class="g2">
      <div class="sel-b">
        <label style="font-size:0.65rem;color:var(--m);">المندوب:</label>
        <select id="cF" class="c-in" onchange="rnd()">
          <option value="all">عرض كل المناديب</option>
          <option value="ahmed" selected>أحمد</option>
          <option value="biko">بيكو</option>
          <option value="mina">مينا عبد النور</option>
        </select>
      </div>
      <div class="sel-b">
        <label style="font-size:0.65rem;color:var(--m);">الوردية:</label>
        <input type="date" id="dF" class="c-in" value="2026-11-08" onchange="rnd()">
      </div>
    </div>
  </header>

  <div class="kpi">
    <div class="kpi-b"><div id="kC" style="font-size:1.1rem;font-weight:bold;color:#38bdf8;">2</div><div style="font-size:0.7rem;color:var(--m);">منجزة</div></div>
    <div class="kpi-b"><div id="kM" style="font-size:1.1rem;font-weight:bold;color:#38bdf8;">290 ج.م</div><div style="font-size:0.7rem;color:var(--m);">محصل</div></div>
  </div>

  <div id="lst"></div>

  <!-- النوافذ -->
  <div class="modal" id="mLoc"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>📍 مواقع المناديب</b><span style="cursor:pointer;" onclick="clsM('mLoc')">✕</span></div><div id="locBody"></div></div></div>
  <div class="modal" id="mL"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>🔐 الحساب</b><span style="cursor:pointer;" onclick="clsM('mL')">✕</span></div><select id="uSel" class="c-in" style="margin-bottom:8px;"><option value="admin">👑 المدير</option><option value="ahmed">🚴 أحمد</option><option value="biko">🚴 بيكو</option></select><button class="btn-s" style="background:#2563eb;width:100%;" onclick="doL()">دخول</button></div></div>
  <div class="modal" id="mP"><div class="m-box"><b>📦 استلام جزئي</b><input type="number" id="pAmt" class="c-in" placeholder="المبلغ الفعلي" style="margin:8px 0;"><button class="btn-s" style="background:#8b5cf6;width:100%;" onclick="svP()">تأكيد</button></div></div>
  <div class="modal" id="mR"><div class="m-box"><b>📅 تأجيل الشحنة</b><input type="date" id="rD" class="c-in" style="margin:8px 0;"><button class="btn-s" style="background:var(--w);width:100%;" onclick="svR()">حفظ</button></div></div>

  <script>
    let raw = [
      { id:"1", code:"7791", name:"Demyana Botros Zachary", phone:"01001232790", addr:"الاسكندرية العجمي البيطاش ش مسجد الهدي الاندلس والحجاز عمارة 2", cod:190, st:"delivered", coll:190, cid:"ahmed" },
      { id:"2", code:"12258", name:"شروق", phone:"01059947327", addr:"شارع العوامي خلف مدرسة العجمي النموذجية عمارة سنتر الفيروز", cod:610, st:"returned", coll:0, cid:"ahmed" },
      { id:"3", code:"12282", name:"فيلوباتير", phone:"01507992457", addr:"105 ش المكس القباري - اسكندرية", cod:610, st:"out", coll:0, cid:"ahmed" }
    ];

    let actId = null;
    function clsM(id){ document.getElementById(id).style.display = 'none'; }
    function opM(id){ document.getElementById(id).style.display = 'flex'; }

    function rnd(){
      const q = (document.getElementById('q').value||'').trim().toLowerCase();
      const c = document.getElementById('cF').value;
      const list = raw.filter(x => (!q || x.code.includes(q) || x.name.toLowerCase().includes(q) || x.addr.toLowerCase().includes(q)) && (c === 'all' || x.cid === c));
      
      let done = 0, money = 0, h = '';
      list.forEach((s, i) => {
        if(s.st==='delivered'||s.st==='partial'||s.st==='shipping'){ done++; money += Number(s.coll||0); }
        let badge = s.st==='delivered'?'تم التسليم ✓':s.st==='shipping'?'شحن 75ج':s.st==='partial'?'استلام جزئي':s.st==='returned'?'مرتجع ✕':s.st==='rescheduled'?'مؤجل 📅':'قيد التوصيل';
        const wa = `https://wa.me/2${s.phone}?text=${encodeURIComponent('السلام عليكم أستاذ '+s.name+'، شحنتك رقم '+s.code+' مطلوب '+s.cod+' ج')}`;

        h += `<div class="card">
          <div style="display:flex;justify-content:space-between;font-weight:bold;margin-bottom:4px;">
            <span style="color:#38bdf8;">#${i+1} 🏷️ ${s.code}</span>
            <span style="font-size:0.75rem;padding:2px 6px;border-radius:4px;background:#334155;">${badge}</span>
          </div>
          <div style="font-weight:600;">${s.name}</div>
          <div style="font-size:0.75rem;color:var(--m);margin:2px 0;">${s.addr}</div>
          <div style="display:flex;justify-content:space-between;background:rgba(0,0,0,0.25);padding:4px 8px;border-radius:4px;margin:6px 0;font-size:0.8rem;">
            <span>المطلوب: <b>${s.cod}ج</b></span>
            <span>المحصل: <b style="color:#38bdf8;">${s.coll}ج</b></span>
          </div>
          <div class="acts">
            <a href="tel:${s.phone}" class="btn-a">📞 اتصال</a>
            <a href="${wa}" target="_blank" class="btn-a" style="border-color:#25d366;color:#25d366;">💬 واتساب</a>
            <a href="https://maps.google.com/?q=${encodeURIComponent(s.addr)}" target="_blank" class="btn-a">🗺️ خريطة</a>
          </div>
          <div class="st-g">
            <button class="btn-s" style="background:var(--s);grid-column:span 2;" onclick="setSt('${s.id}','delivered',${s.cod})">تم التسليم كامل ✓</button>
            <button class="btn-s" style="background:#8b5cf6;" onclick="opP('${s.id}')">استلام جزئي</button>
            <button class="btn-s" style="background:#0d9488;" onclick="setSt('${s.id}','shipping',75)">شحن فقط (75)</button>
            <button class="btn-s" style="background:var(--w);" onclick="opR('${s.id}')">تأجيل 📅</button>
            <button class="btn-s" style="background:var(--d);" onclick="setSt('${s.id}','returned',0)">مرتجع ✕</button>
          </div>
        </div>`;
      });

      document.getElementById('lst').innerHTML = h || '<p style="text-align:center;color:var(--m);margin-top:20px;">لا توجد شحنات.</p>';
      document.getElementById('kC').innerText = done;
      document.getElementById('kM').innerText = money + ' ج.م';
    }

    function setSt(id, st, amt){
      const it = raw.find(x => x.id === id);
      if(it){ it.st = st; it.coll = amt; rnd(); }
    }

    function opP(id){ actId = id; document.getElementById('pAmt').value = ''; opM('mP'); }
    function svP(){ const a = Number(document.getElementById('pAmt').value); if(a>=0){ clsM('mP'); setSt(actId, 'partial', a); } }
    function opR(id){ actId = id; opM('mR'); }
    function svR(){ clsM('mR'); setSt(actId, 'rescheduled', 0); }

    function opScan(){ const c = prompt('امسح الباركود أو اكتب الكود:'); if(c){ document.getElementById('q').value = c.trim(); rnd(); } }
    function opL(){ opM('mL'); }
    function doL(){
      const u = document.getElementById('uSel').value;
      document.getElementById('uN').innerText = (u==='admin'?'👑 المدير':'🚴 '+u);
      document.getElementById('cF').value = (u==='admin'?'all':u);
      clsM('mL'); rnd();
    }
    function opLoc(){
      if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(p=>{
          document.getElementById('locBody').innerHTML = `<p style="margin-bottom:8px;">موقع المندوب أحمد:</p><a href="https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}" target="_blank" style="color:#25d366;text-decoration:none;">🗺️ اضغط لفتح الموقع على خرائط Google</a>`;
          opM('mLoc');
        }, ()=>{
          document.getElementById('locBody').innerHTML = '<p style="color:#f87171;">فعّل الموقع GPS على الهاتف أولاً.</p>';
          opM('mLoc');
        });
      }
    }

    rnd();
  </script>
</body>
</html>
