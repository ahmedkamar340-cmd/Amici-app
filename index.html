<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>أميتشي إكسبريس</title>
  <style>
    :root{--bg:#0f172a;--c:#1e293b;--b:#334155;--m:#94a3b8;--s:#16a34a;--w:#d97706;--d:#dc2626;}
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;}
    body{background:var(--bg);color:#f8fafc;padding-bottom:90px;}
    header{background:var(--c);padding:10px;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:20;}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
    .btns{display:flex;gap:4px;overflow-x:auto;}
    .btn-h{background:#334155;border:1px solid #475569;color:#fff;padding:6px 9px;border-radius:6px;font-size:0.75rem;cursor:pointer;white-space:nowrap;}
    .btn-h:active{background:#475569;}
    .s-in{width:100%;background:#0f172a;color:#fff;border:1px solid var(--b);padding:8px;border-radius:6px;font-size:0.85rem;outline:none;margin-bottom:6px;}
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
    .sel-b{background:rgba(0,0,0,0.25);padding:5px;border-radius:6px;border:1px solid var(--b);}
    .c-in{width:100%;background:#0f172a;color:#fff;border:1px solid var(--b);padding:6px;border-radius:4px;font-size:0.8rem;outline:none;}
    .kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px;}
    .kpi-b{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:8px;text-align:center;}
    .card{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:12px;margin:10px;position:relative;}
    .acts{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:4px;margin:8px 0;}
    .btn-a{background:transparent;border:1px solid var(--b);color:#fff;padding:6px;border-radius:5px;text-decoration:none;text-align:center;font-size:0.75rem;font-weight:bold;}
    .st-g{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
    .btn-s{border:none;padding:10px 5px;border-radius:6px;font-weight:bold;font-size:0.75rem;cursor:pointer;color:#fff;}
    .btn-s:active{filter:brightness(1.2);}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:99999;justify-content:center;align-items:center;padding:12px;}
    .m-box{background:var(--c);border:1px solid var(--b);border-radius:8px;width:100%;max-width:380px;padding:14px;max-height:85vh;overflow-y:auto;}
    .rep-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--b);font-size:0.82rem;}
    .rep-tb{width:100%;border-collapse:collapse;font-size:0.75rem;margin:10px 0;}
    .rep-tb th,.rep-tb td{border:1px solid var(--b);padding:5px;text-align:center;}
    .rep-tb th{background:#0f172a;}
  </style>
</head>
<body>
  <header>
    <div class="top">
      <h1 style="font-size:0.95rem;color:#38bdf8;">أميتشي <span id="uN" style="font-size:0.72rem;color:#fff;">👑 المدير</span></h1>
      <div class="btns">
        <button type="button" class="btn-h" style="background:#059669;" onclick="runRep()">📑 تقرير الوردية</button>
        <button type="button" class="btn-h" style="background:#0284c7;" onclick="runScan()">📷 باركود</button>
        <button type="button" class="btn-h" style="background:#0284c7;" onclick="runLoc()">📍 المناديب</button>
        <button type="button" class="btn-h" style="background:#8b5cf6;" onclick="runLogin()">🔄 حساب</button>
      </div>
    </div>
    <input type="text" id="q" class="s-in" placeholder="🔍 بحث بالشحنة أو الاسم..." oninput="draw()">
    <div class="g2">
      <div class="sel-b">
        <label style="font-size:0.65rem;color:var(--m);">المندوب:</label>
        <select id="cF" class="c-in" onchange="draw()">
          <option value="all">عرض كل المناديب</option>
          <option value="c1" selected>أحمد</option>
          <option value="c2">بيكو</option>
          <option value="c3">مينا عبد النور</option>
        </select>
      </div>
      <div class="sel-b">
        <label style="font-size:0.65rem;color:var(--m);">الوردية:</label>
        <input type="date" id="dF" class="c-in" onchange="draw()">
      </div>
    </div>
  </header>

  <div class="kpi">
    <div class="kpi-b"><div id="kC" style="font-size:1.15rem;font-weight:bold;color:#38bdf8;">0</div><div style="font-size:0.7rem;color:var(--m);">منجزة</div></div>
    <div class="kpi-b"><div id="kM" style="font-size:1.15rem;font-weight:bold;color:#38bdf8;">0 ج.م</div><div style="font-size:0.7rem;color:var(--m);">محصل</div></div>
  </div>

  <div id="lst"></div>

  <!-- تقرير الوردية -->
  <div class="modal" id="mRep">
    <div class="m-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <b style="color:#38bdf8;font-size:0.95rem;">📑 تقرير تقفيل الوردية</b>
        <span style="cursor:pointer;font-size:1.3rem;padding:2px 8px;" onclick="closeModal('mRep')">✕</span>
      </div>
      <div id="repBody"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;">
        <button type="button" class="btn-s" style="background:#2563eb;" onclick="sendWA()">📲 واتساب</button>
        <button type="button" class="btn-s" style="background:#0284c7;" onclick="window.print()">🖨️ طباعة</button>
      </div>
    </div>
  </div>

  <!-- المواقع -->
  <div class="modal" id="mLoc">
    <div class="m-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <b>📍 تتبع المناديب (GPS)</b>
        <span style="cursor:pointer;font-size:1.3rem;padding:2px 8px;" onclick="closeModal('mLoc')">✕</span>
      </div>
      <div id="locBody"></div>
    </div>
  </div>

  <!-- تبديل الحساب -->
  <div class="modal" id="mL">
    <div class="m-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <b>🔐 تبديل الحساب</b>
        <span style="cursor:pointer;font-size:1.3rem;padding:2px 8px;" onclick="closeModal('mL')">✕</span>
      </div>
      <select id="userSel" class="c-in" style="margin-bottom:8px;">
        <option value="admin">👑 المدير</option>
        <option value="c1">🚴 أحمد</option>
        <option value="c2">🚴 بيكو</option>
        <option value="c3">🚴 مينا عبد النور</option>
      </select>
      <input type="password" id="userPin" class="c-in" placeholder="PIN (1234)" style="margin-bottom:10px;">
      <button type="button" class="btn-s" style="background:#2563eb;width:100%;" onclick="doLogin()">تسجيل الدخول</button>
    </div>
  </div>

  <!-- استلام جزئي -->
  <div class="modal" id="mP">
    <div class="m-box">
      <b>📦 استلام جزئي</b>
      <input type="hidden" id="partId">
      <input type="number" id="partAmt" class="c-in" placeholder="المبلغ الفعلي المستلم" style="margin:10px 0;">
      <button type="button" class="btn-s" style="background:#8b5cf6;width:100%;" onclick="savePartial()">تأكيد المبلغ</button>
    </div>
  </div>

  <!-- تأجيل -->
  <div class="modal" id="mR">
    <div class="m-box">
      <b>📅 تأجيل الشحنة</b>
      <input type="hidden" id="rId">
      <input type="date" id="rDate" class="c-in" style="margin:10px 0;">
      <button type="button" class="btn-s" style="background:var(--w);width:100%;" onclick="saveResched()">حفظ التأجيل</button>
    </div>
  </div>

  <script>
    // إلغاء كاش المتصفح القديم تماماً
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));
    }

    let currentUser = { role: 'admin', name: 'المدير' };

    let items = [
      { id: "1", code: "7791", name: "Demyana Botros Zachary", phone: "01001232790", addr: "الاسكندرية العجمي البيطاش ش مسجد الهدي الاندلس والحجاز عمارة 2", cod: 190, status: "delivered", collected: 190, cid: "c1" },
      { id: "2", code: "12258", name: "شروق", phone: "01059947327", addr: "شارع العوامي خلف مدرسة العجمي النموذجية عمارة سنتر الفيروز", cod: 610, status: "returned", collected: 0, cid: "c1" },
      { id: "3", code: "12282", name: "فيلوباتير", phone: "01507992457", addr: "105 ش المكس القباري - اسكندرية", cod: 610, status: "out", collected: 0, cid: "c1" }
    ];

    function openModal(id){
      document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
      document.getElementById(id).style.display = 'flex';
    }
    function closeModal(id){
      document.getElementById(id).style.display = 'none';
    }

    function setStatus(id, st, amt){
      const it = items.find(x => x.id === id);
      if(it){
        it.status = st;
        it.collected = amt;
        draw();
      }
    }

    function draw(){
      const q = (document.getElementById('q').value || '').trim().toLowerCase();
      const selC = document.getElementById('cF').value;

      const filtered = items.filter(it => {
        const matchQ = !q || it.code.includes(q) || it.name.toLowerCase().includes(q) || it.phone.includes(q) || it.addr.includes(q);
        const matchC = (selC === 'all' || it.cid === selC);
        return matchQ && matchC;
      });

      let cDone = 0, mDone = 0, html = '';

      filtered.forEach((it, idx) => {
        if(it.status === 'delivered' || it.status === 'shipping' || it.status === 'partial'){
          cDone++;
          mDone += Number(it.collected || 0);
        }

        let stLabel = 'قيد التوصيل';
        if(it.status === 'delivered') stLabel = 'تم التسليم ✓';
        if(it.status === 'shipping') stLabel = 'شحن 75ج';
        if(it.status === 'partial') stLabel = 'استلام جزئي';
        if(it.status === 'returned') stLabel = 'مرتجع ✕';
        if(it.status === 'rescheduled') stLabel = 'مؤجل 📅';

        const wa = `https://wa.me/2${it.phone}?text=${encodeURIComponent('السلام عليكم أستاذ '+it.name+'، شحنتك رقم ('+it.code+') مطلوب '+it.cod+' ج.م')}`;

        html += `
          <div class="card">
            <div style="display:flex;justify-content:space-between;font-weight:bold;margin-bottom:4px;">
              <span style="color:#38bdf8;">#${idx+1} 🏷️ ${it.code}</span>
              <span style="font-size:0.75rem;padding:2px 6px;border-radius:4px;background:#334155;">${stLabel}</span>
            </div>
            <div style="font-weight:600;">${it.name}</div>
            <div style="font-size:0.75rem;color:var(--m);margin:2px 0;">${it.addr}</div>
            <div style="display:flex;justify-content:space-between;background:rgba(0,0,0,0.25);padding:4px 8px;border-radius:4px;margin:6px 0;font-size:0.8rem;">
              <span>المطلوب: <b>${it.cod}ج</b></span>
              <span>المحصل: <b style="color:#38bdf8;">${it.collected}ج</b></span>
            </div>
            <div class="acts">
              <a href="tel:${it.phone}" class="btn-a">📞 اتصال</a>
              <a href="${wa}" target="_blank" class="btn-a" style="background:rgba(37,211,102,0.15);border-color:#25d366;color:#25d366;">💬 واتساب</a>
              <a href="https://maps.google.com/?q=${encodeURIComponent(it.addr)}" target="_blank" class="btn-a">🗺️ خريطة</a>
            </div>
            <div class="st-g">
              <button type="button" class="btn-s" style="background:var(--s);grid-column:span 2;" onclick="setStatus('${it.id}','delivered',${it.cod})">تم التسليم كامل ✓</button>
              <button type="button" class="btn-s" style="background:#8b5cf6;" onclick="showPartial('${it.id}')">استلام جزئي</button>
              <button type="button" class="btn-s" style="background:#0d9488;" onclick="setStatus('${it.id}','shipping',75)">شحن فقط (75)</button>
              <button type="button" class="btn-s" style="background:var(--w);" onclick="showResched('${it.id}')">تأجيل 📅</button>
              <button type="button" class="btn-s" style="background:var(--d);" onclick="setStatus('${it.id}','returned',0)">مرتجع ✕</button>
            </div>
          </div>
        `;
      });

      document.getElementById('lst').innerHTML = html || '<p style="text-align:center;color:var(--m);margin-top:25px;">لا توجد شحنات.</p>';
      document.getElementById('kC').innerText = cDone;
      document.getElementById('kM').innerText = mDone + ' ج.م';
    }

    function showPartial(id){
      document.getElementById('partId').value = id;
      document.getElementById('partAmt').value = '';
      openModal('mP');
    }
    function savePartial(){
      const id = document.getElementById('partId').value;
      const amt = Number(document.getElementById('partAmt').value) || 0;
      closeModal('mP');
      setStatus(id, 'partial', amt);
    }

    function showResched(id){
      document.getElementById('rId').value = id;
      openModal('mR');
    }
    function saveResched(){
      const id = document.getElementById('rId').value;
      closeModal('mR');
      setStatus(id, 'rescheduled', 0);
    }

    let reportMsg = '';
    function runRep(){
      let tot = items.length, done = 0, ret = 0, money = 0;
      let rows = '';

      items.forEach((it, idx) => {
        if(it.status === 'delivered' || it.status === 'shipping' || it.status === 'partial'){
          done++;
          money += Number(it.collected || 0);
        } else if(it.status === 'returned' || it.status === 'rescheduled'){
          ret++;
        }
        rows += `<tr><td>#${idx+1}</td><td>${it.code}</td><td>${it.name}</td><td>${it.collected}ج</td></tr>`;
      });

      const net = money - (done * 25);

      document.getElementById('repBody').innerHTML = `
        <div style="background:#0f172a;padding:8px;border-radius:6px;border:1px solid var(--b);margin-bottom:8px;">
          <div class="rep-row"><span>إجمالي الشحنات:</span><b>${tot}</b></div>
          <div class="rep-row"><span>الشحنات الناجحة:</span><b style="color:var(--s);">${done}</b></div>
          <div class="rep-row"><span>مرتجع ومؤجل:</span><b style="color:#f87171;">${ret}</b></div>
          <div class="rep-row" style="color:#38bdf8;"><span>إجمالي المحصل:</span><b>${money} ج.م</b></div>
          <div class="rep-row" style="color:var(--s);border-bottom:none;"><span>صافي توريد الخزينة:</span><b>${net} ج.م</b></div>
        </div>
        <table class="rep-tb"><thead><tr><th>#</th><th>الكود</th><th>العميل</th><th>المحصل</th></tr></thead><tbody>${rows}</tbody></table>
      `;

      reportMsg = `*تقرير تقفيل وردية أميتشي*\n📦 الشحنات: ${tot}\n✅ الناجحة: ${done}\n❌ المرتجع: ${ret}\n💵 المحصل: ${money} ج.م\n💰 صافي الخزينة: ${net} ج.م`;
      openModal('mRep');
    }

    function sendWA(){
      if(reportMsg) window.open(`https://wa.me/?text=${encodeURIComponent(reportMsg)}`, '_blank');
    }

    function runScan(){
      const code = prompt('امسح الباركود أو اكتب الكود:');
      if(code){
        document.getElementById('q').value = code.trim();
        draw();
      }
    }

    function runLoc(){
      if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(pos=>{
          const url = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
          document.getElementById('locBody').innerHTML = `
            <div style="background:#0f172a;padding:10px;border-radius:6px;border:1px solid #334155;">
              <b>🚴 موقع المندوب الحي متصل:</b>
              <div style="margin-top:8px;"><a href="${url}" target="_blank" style="color:#25d366;font-size:0.85rem;text-decoration:none;">🗺️ اضغط لفتح الموقع المباشر على خرائط جوجل</a></div>
            </div>
          `;
          openModal('mLoc');
        }, ()=>{
          document.getElementById('locBody').innerHTML = '<p style="color:#f87171;">يرجى تفعيل الـ GPS في الهاتف والسماح بالوصول للموقع.</p>';
          openModal('mLoc');
        });
      } else {
        alert('خاصية تحديد الموقع غير مدعومة في جهازك.');
      }
    }

    function runLogin(){
      openModal('mL');
    }

    function doLogin(){
      const u = document.getElementById('userSel').value;
      const p = document.getElementById('userPin').value;
      if(p === '1234' || !p){
        if(u === 'admin'){
          currentUser = { role: 'admin', name: 'المدير' };
          document.getElementById('uN').innerText = '👑 المدير';
          document.getElementById('cF').disabled = false;
        } else {
          const names = { c1: 'أحمد', c2: 'بيكو', c3: 'مينا عبد النور' };
          currentUser = { role: 'courier', name: names[u] };
          document.getElementById('uN').innerText = '🚴 ' + names[u];
          document.getElementById('cF').value = u;
          document.getElementById('cF').disabled = true;
        }
        closeModal('mL');
        draw();
      } else {
        alert('رمز PIN خطأ');
      }
    }

    document.getElementById('dF').value = new Date().toISOString().split('T')[0];
    draw();
  </script>
</body>
</html>
