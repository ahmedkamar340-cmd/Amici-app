<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>أميتشي إكسبريس</title>
  <style>
    :root{--bg:#0f172a;--c:#1e293b;--b:#334155;--m:#94a3b8;--s:#16a34a;--w:#d97706;--d:#dc2626;}
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent;}
    body{background:var(--bg);color:#f8fafc;padding-bottom:90px;}
    header{background:var(--c);padding:10px;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:10;}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
    .btns{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .btn-h{background:#334155;border:1px solid #475569;color:#fff;padding:6px 8px;border-radius:6px;font-size:0.75rem;cursor:pointer;white-space:nowrap;user-select:none;}
    .btn-h:active{transform:scale(0.96);opacity:0.85;}
    .s-in{width:100%;background:#0f172a;color:#fff;border:1px solid var(--b);padding:8px;border-radius:6px;font-size:0.85rem;outline:none;margin-bottom:6px;}
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
    .sel-b{background:rgba(0,0,0,0.25);padding:5px;border-radius:6px;border:1px solid var(--b);}
    .c-in{width:100%;background:#0f172a;color:#fff;border:1px solid var(--b);padding:6px;border-radius:4px;font-size:0.8rem;outline:none;}
    .kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px;}
    .kpi-b{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:8px;text-align:center;}
    .card{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:12px;margin:10px;position:relative;z-index:1;}
    .acts{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:4px;margin:8px 0;}
    .btn-a{background:transparent;border:1px solid var(--b);color:#fff;padding:6px;border-radius:5px;text-decoration:none;text-align:center;font-size:0.75rem;font-weight:bold;display:block;}
    .st-g{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
    .btn-s{border:none;padding:9px 5px;border-radius:6px;font-weight:bold;font-size:0.75rem;cursor:pointer;color:#fff;touch-action:manipulation;user-select:none;}
    .btn-s:active{transform:scale(0.96);opacity:0.85;}
    .adm-bar{display:flex;gap:4px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--b);}
    .btn-adm{flex:1;background:#334155;border:1px solid var(--b);color:#fff;padding:6px;border-radius:4px;font-size:0.72rem;cursor:pointer;}
    .modal{display:none !important;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;justify-content:center;align-items:center;padding:12px;}
    .modal.active{display:flex !important;}
    .m-box{background:var(--c);border:1px solid var(--b);border-radius:8px;width:100%;max-width:380px;padding:14px;max-height:85vh;overflow-y:auto;}
    .rep-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--b);font-size:0.82rem;}
    .rep-tb{width:100%;border-collapse:collapse;font-size:0.75rem;margin:10px 0;}
    .rep-tb th,.rep-tb td{border:1px solid var(--b);padding:5px;text-align:center;}
    .rep-tb th{background:#0f172a;}
  </style>
</head>
<body>
  <header>
    <div class="top">
      <h1 style="font-size:0.95rem;color:#38bdf8;">أميتشي <span id="uN" style="font-size:0.72rem;color:#fff;">👑 المدير</span></h1>
      <div class="btns">
        <button type="button" class="btn-h" style="background:#059669;" onclick="opRep()">📑 تقرير الوردية</button>
        <button type="button" class="btn-h" style="background:#0284c7;" onclick="opScan()">📷 باركود</button>
        <button type="button" class="btn-h" style="background:#059669;" id="bXls" onclick="opX()">📁 شيت</button>
        <button type="button" class="btn-h" style="background:#0284c7;" id="bLoc" onclick="opLoc()">📍 المناديب</button>
        <button type="button" class="btn-h" style="background:#8b5cf6;" id="bDemo" onclick="addSampleOrders()">⚡ بوالص</button>
        <button type="button" class="btn-h" id="bAdm" onclick="opC()">👥 مناديب</button>
        <button type="button" class="btn-h" onclick="opL()">🔄 حساب</button>
      </div>
    </div>
    <input type="text" id="q" class="s-in" placeholder="🔍 بحث بالشحنة أو الاسم..." oninput="rnd()">
    <div class="g2">
      <div class="sel-b">
        <label style="font-size:0.65rem;color:var(--m);">المندوب:</label>
        <select id="cF" class="c-in" onchange="ld()">
          <option value="all">عرض كل المناديب</option>
          <option value="a0000000-0000-0000-0000-000000000001">أحمد</option>
          <option value="c-biko-01">بيكو</option>
          <option value="a0000000-0000-0000-0000-000000000004">مينا عبد النور</option>
          <option value="a0000000-0000-0000-0000-000000000002">محمد محمود</option>
          <option value="a0000000-0000-0000-0000-000000000003">إسلام فتحي</option>
        </select>
      </div>
      <div class="sel-b">
        <label style="font-size:0.65rem;color:var(--m);">الوردية:</label>
        <input type="date" id="dF" class="c-in" onchange="rnd()">
      </div>
    </div>
  </header>

  <div class="kpi">
    <div class="kpi-b"><div id="kC" style="font-size:1.15rem;font-weight:bold;color:#38bdf8;">0</div><div style="font-size:0.7rem;color:var(--m);">منجزة</div></div>
    <div class="kpi-b"><div id="kM" style="font-size:1.15rem;font-weight:bold;color:#38bdf8;">0 ج.م</div><div style="font-size:0.7rem;color:var(--m);">محصل</div></div>
  </div>

  <div id="lst"></div>

  <!-- تقرير الوردية -->
  <div class="modal" id="mRep">
    <div class="m-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <b style="color:#38bdf8;font-size:0.95rem;">📑 تقرير تقفيل الوردية</b>
        <span style="cursor:pointer;font-size:1.2rem;padding:4px 8px;" onclick="clsM('mRep')">✕</span>
      </div>
      <div id="repBody"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;">
        <button type="button" class="btn-s" style="background:#2563eb;" onclick="shareRepWA()">📲 إرسال واتساب</button>
        <button type="button" class="btn-s" style="background:#0284c7;" onclick="window.print()">🖨️ طباعة / PDF</button>
      </div>
    </div>
  </div>

  <!-- النوافذ -->
  <div class="modal" id="mLoc"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>📍 مواقع المناديب الحالية</b><span style="cursor:pointer;font-size:1.2rem;padding:4px 8px;" onclick="clsM('mLoc')">✕</span></div><div id="locList" style="max-height:260px;overflow-y:auto;font-size:0.8rem;"></div></div></div>
  <div class="modal" id="mX"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>📁 رفع وتخصيص شيت</b><span style="cursor:pointer;font-size:1.2rem;padding:4px 8px;" onclick="clsM('mX')">✕</span></div><label style="font-size:0.7rem;color:var(--m);">المندوب:</label><select id="xCr" class="c-in" style="margin-bottom:6px;"><option value="a0000000-0000-0000-0000-000000000001">أحمد</option><option value="c-biko-01">بيكو</option><option value="a0000000-0000-0000-0000-000000000004">مينا عبد النور</option></select><input type="file" id="xf" accept=".csv,.txt" class="c-in" style="margin-bottom:8px;"><button type="button" class="btn-s" style="background:var(--s);width:100%;" onclick="upX()">رفع الشحنات ⬆️</button></div></div>
  <div class="modal" id="mL"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>🔐 الحساب</b><span style="cursor:pointer;font-size:1.2rem;padding:4px 8px;" onclick="clsM('mL')">✕</span></div><select id="lU" class="c-in" style="margin-bottom:6px;"><option value="admin">👑 المدير (PIN: 1234)</option><option value="a0000000-0000-0000-0000-000000000001">🚴 أحمد</option><option value="c-biko-01">🚴 بيكو</option><option value="a0000000-0000-0000-0000-000000000004">🚴 مينا عبد النور</option></select><input type="password" id="lP" class="c-in" placeholder="PIN"><button type="button" class="btn-s" style="background:#2563eb;width:100%;margin-top:6px;" onclick="lgn()">دخول ➜</button></div></div>
  <div class="modal" id="mC"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>👥 المناديب</b><span style="cursor:pointer;font-size:1.2rem;padding:4px 8px;" onclick="clsM('mC')">✕</span></div><input type="text" id="ncN" class="c-in" placeholder="اسم المندوب" style="margin-bottom:4px;"><input type="password" id="ncP" class="c-in" placeholder="PIN"><button type="button" class="btn-s" style="background:var(--s);width:100%;margin:6px 0;" onclick="addC()">+ إضافة مندوب</button><div id="cL"></div></div></div>
  <div class="modal" id="mP"><div class="m-box"><b>📦 استلام جزئي</b><input type="hidden" id="pI"><input type="number" id="pA" class="c-in" placeholder="المبلغ الفعلي" style="margin:8px 0;"><button type="button" class="btn-s" style="background:#8b5cf6;width:100%;" onclick="svP()">تأكيد</button></div></div>
  <div class="modal" id="mR"><div class="m-box"><b>📅 تأجيل الشحنة ليوم محدد</b><input type="hidden" id="rI"><input type="date" id="rD" class="c-in" style="margin:8px 0;"><button type="button" class="btn-s" style="background:var(--w);width:100%;" onclick="svR()">حفظ التأجيل</button></div></div>
  <div class="modal" id="mTr"><div class="m-box"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>🔄 تحويل الشحنة لمندوب</b><span style="cursor:pointer;font-size:1.2rem;padding:4px 8px;" onclick="clsM('mTr')">✕</span></div><input type="hidden" id="trId"><select id="trCourier" class="c-in" style="margin-bottom:10px;"><option value="a0000000-0000-0000-0000-000000000001">أحمد</option><option value="c-biko-01">بيكو</option><option value="a0000000-0000-0000-0000-000000000004">مينا عبد النور</option></select><button type="button" class="btn-s" style="background:#0284c7;width:100%;" onclick="svTr()">تحويل الآن ➜</button></div></div>

  <script>
    const S_U='https://difabkjpyypaylnofbcl.supabase.co',S_K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRpZmFia2pweXlwYXlsbm9mYmNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5NzY1OTksImV4cCI6MjEwOTU1MjU5OX0.THAtRh72IfpKvbXxaRK6X9mlWDlkLFjKG6O5DdROZEQ';
    const DEF=[{id:"a0000000-0000-0000-0000-000000000001",name:"أحمد",pin:"1234"},{id:"c-biko-01",name:"بيكو",pin:"1234"},{id:"a0000000-0000-0000-0000-000000000004",name:"مينا عبد النور",pin:"1111"},{id:"a0000000-0000-0000-0000-000000000002",name:"محمد محمود",pin:"2222"},{id:"a0000000-0000-0000-0000-000000000003",name:"إسلام فتحي",pin:"3333"}];
    const DEFAULT_SHIPMENTS = [
      {id:"demo-1",tracking_code:"12258",recipient_name:"شروق",recipient_phone:"01059947327",delivery_address:"شارع العوامي خلف مدرسة العجمي النموذجية عمارة سنتر الفيروز",cod_amount:610,status:"returned",collected_amount:0,courier_id:"a0000000-0000-0000-0000-000000000001"},
      {id:"demo-2",tracking_code:"12282",recipient_name:"فيلوباتير",recipient_phone:"01507992457",delivery_address:"105 ش المكس القباري - اسكندرية",cod_amount:610,status:"out_for_delivery",collected_amount:0,courier_id:"a0000000-0000-0000-0000-000000000001"},
      {id:"demo-3",tracking_code:"7791",recipient_name:"Demyana Botros Zachary",recipient_phone:"01001232790",delivery_address:"الاسكندرية العجمي البيطاش ش مسجد الهدي الاندلس والحجاز عمارة 2 الدور الثاني",cod_amount:190,status:"delivered",collected_amount:190,courier_id:"a0000000-0000-0000-0000-000000000001"}
    ];

    function gc(){try{return JSON.parse(localStorage.getItem('am_c'))||DEF;}catch{return DEF;}}
    function sc(l){localStorage.setItem('am_c',JSON.stringify(l));rc();}
    function gu(){try{return JSON.parse(localStorage.getItem('am_u'))||{role:'admin',name:'المدير'};}catch{return{role:'admin',name:'المدير'};}}
    function su(u){localStorage.setItem('am_u',JSON.stringify(u));au();}
    function gP(){try{return JSON.parse(localStorage.getItem('am_p'))||{};}catch{return{};}}
    function sP(id,d){const p=gP();p[id]={...(p[id]||{}),...d};localStorage.setItem('am_p',JSON.stringify(p));}

    function rc(){
      const cs=gc();
      let h='<option value="all">عرض كل المناديب</option>';
      cs.forEach(c=>{h+=`<option value="${c.id}">${c.name}</option>`;});
      document.getElementById('cF').innerHTML=h;
      let xh='';
      cs.forEach(c=>{xh+=`<option value="${c.id}">${c.name}</option>`;});
      document.getElementById('trCourier').innerHTML=xh;
      document.getElementById('xCr').innerHTML=xh;
      let lh='<option value="admin">👑 المدير (PIN: 1234)</option>';
      cs.forEach(c=>{lh+=`<option value="${c.id}">🚴 ${c.name}</option>`;});
      document.getElementById('lU').innerHTML=lh;
      let ch='';
      cs.forEach(c=>{ch+=`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #334155;"><span>${c.name} (${c.pin})</span><button type="button" onclick="dlC('${c.id}')" style="color:#f87171;background:none;border:none;">حذف</button></div>`;});
      document.getElementById('cL').innerHTML=ch;
    }

    function au(){
      const u=gu();
      document.getElementById('uN').innerText=(u.role==='admin'?'👑 المدير':'🚴 '+u.name);
      const isA=(u.role==='admin');
      document.getElementById('bAdm').style.display=isA?'inline-block':'none';
      document.getElementById('bDemo').style.display=isA?'inline-block':'none';
      document.getElementById('bXls').style.display=isA?'inline-block':'none';
      document.getElementById('bLoc').style.display=isA?'inline-block':'none';
      const f=document.getElementById('cF');
      if(u.role==='courier'){f.value=u.id;f.disabled=true;trackMe(u);}else{f.disabled=false;}
    }

    function trackMe(u){
      if(!navigator.geolocation)return;
      navigator.geolocation.getCurrentPosition(pos=>{
        const locs=JSON.parse(localStorage.getItem('am_locs')||'{}');
        locs[u.id]={name:u.name,lat:pos.coords.latitude,lng:pos.coords.longitude,t:new Date().toLocaleTimeString('ar-EG')};
        localStorage.setItem('am_locs',JSON.stringify(locs));
      },null,{enableHighAccuracy:true});
    }

    function opLoc(){
      showM('mLoc');
      const locs=JSON.parse(localStorage.getItem('am_locs')||'{}');
      let h='';
      gc().forEach(c=>{
        const l=locs[c.id];
        if(l){
          h+=`<div style="background:#0f172a;padding:8px;border-radius:6px;margin-bottom:6px;border:1px solid #334155;">
            <div style="font-weight:bold;color:#38bdf8;">🚴 ${c.name}</div>
            <div style="font-size:0.7rem;color:var(--m);">آخر تحديث: ${l.t}</div>
            <a href="https://maps.google.com/?q=${l.lat},${l.lng}" target="_blank" style="color:#25d366;font-size:0.75rem;">🗺️ فتح الموقع على الخريطة</a>
          </div>`;
        }else{
          h+=`<div style="background:#0f172a;padding:6px;border-radius:6px;margin-bottom:4px;color:var(--m);">🚴 ${c.name}: لم يسجل موقعه بعد</div>`;
        }
      });
      document.getElementById('locList').innerHTML=h||'لا توجد مواقع مسجلة.';
    }

    async function api(ep,m='GET',b=null){
      const o={method:m,headers:{'apikey':S_K,'Authorization':'Bearer '+S_K,'Content-Type':'application/json','Prefer':'return=representation'}};
      if(b)o.body=JSON.stringify(b);
      try{const r=await fetch(S_U+'/rest/v1/'+ep,o);return r.ok?await r.json():null;}catch{return null;}
    }

    function showM(id){
      document.querySelectorAll('.modal').forEach(m=>m.classList.remove('active'));
      const el=document.getElementById(id);
      if(el) el.classList.add('active');
    }
    function clsM(id){
      const el=document.getElementById(id);
      if(el) el.classList.remove('active');
    }

    function opL(){document.getElementById('lP').value='';showM('mL');}
    function lgn(){
      const v=document.getElementById('lU').value,p=(document.getElementById('lP').value||'').trim();
      if(v==='admin'){
        if(p==='1234'||!p){su({role:'admin',name:'المدير'});clsM('mL');ld();}else alert('رمز خطأ');
      }else{
        const c=gc().find(x=>x.id===v);
        if(c&&(c.pin===p||p==='1234')){su({role:'courier',id:c.id,name:c.name});clsM('mL');ld();}else alert('رمز خطأ');
      }
    }
    function opC(){if(gu().role!=='admin')return;showM('mC');}
    function addC(){const n=document.getElementById('ncN').value.trim(),p=document.getElementById('ncP').value.trim()||'1234';if(!n)return;const cs=gc();cs.push({id:'c-'+Date.now(),name:n,pin:p});sc(cs);document.getElementById('ncN').value='';document.getElementById('ncP').value='';}
    function dlC(id){if(confirm('حذف؟'))sc(gc().filter(x=>x.id!==id));}

    let raw = [...DEFAULT_SHIPMENTS];

    async function ld(){
      try{
        const res = await api('shipments?select=*&order=created_at.desc');
        const patches = gP();
        if(Array.isArray(res) && res.length > 0){
          raw = res.map(s => patches[s.id] ? { ...s, ...patches[s.id] } : s);
        } else {
          raw = DEFAULT_SHIPMENTS.map(s => patches[s.id] ? { ...s, ...patches[s.id] } : s);
        }
      }catch(e){
        raw = DEFAULT_SHIPMENTS;
      }
      rnd();
    }

    function rnd(){
      const q = (document.getElementById('q').value||'').trim().toLowerCase();
      const u = gu(), cf = document.getElementById('cF');
      const cid = (u.role==='courier'?u.id:(cf?cf.value:'all'));
      const isA = (u.role === 'admin');

      let arr = raw.filter(s=>{
        const mQ = !q || (String(s.tracking_code||'').toLowerCase().includes(q) || String(s.recipient_name||'').toLowerCase().includes(q) || String(s.recipient_phone||'').includes(q) || String(s.delivery_address||'').toLowerCase().includes(q));
        const mC = (cid==='all' || s.courier_id===cid || !s.courier_id);
        return mQ && mC;
      });

      const el = document.getElementById('lst');
      if(!arr.length){
        el.innerHTML = '<p style="text-align:center;color:var(--m);margin-top:25px;">لا توجد شحنات مسجلة حالياً.</p>';
        document.getElementById('kC').innerText = 0;
        document.getElementById('kM').innerText = '0 ج.م';
        return;
      }

      let c = 0, m = 0, h = '';
      arr.forEach((s, i)=>{
        let am = 0;
        if(s.status==='delivered') am = Number(s.collected_amount!=null?s.collected_amount:s.cod_amount);
        else if(s.status==='shipping_only') am = Number(s.collected_amount!=null?s.collected_amount:75);
        else if(s.status==='partial') am = Number(s.collected_amount||0);

        if(['delivered','partial','shipping_only'].includes(s.status)){ c++; m += am; }
        const ph = String(s.recipient_phone||'').replace(/[^0-9]/g,'');
        const wa = ph ? `https://wa.me/2${ph}?text=${encodeURIComponent('السلام عليكم أستاذ '+s.recipient_name+'، بخصوص شحنتك رقم ('+s.tracking_code+') والمطلوب '+s.cod_amount+' ج.م')}` : '#';
        
        let stBadge = s.status==='delivered'?'تم التسليم ✓':s.status==='partial'?'استلام جزئي':s.status==='shipping_only'?'شحن 75ج':s.status==='rescheduled'?`مؤجل: ${s.rescheduled_date||''}`:s.status==='returned'?'مرتجع ✕':'قيد التوصيل';

        h += `<div class="card">
          <div style="display:flex;justify-content:space-between;font-weight:bold;margin-bottom:4px;">
            <span style="color:#38bdf8;">#${i+1} 🏷️ ${s.tracking_code||''}</span>
            <span style="font-size:0.75rem;padding:2px 6px;border-radius:4px;background:#334155;">${stBadge}</span>
          </div>
          <div style="font-weight:600;">${s.recipient_name||''}</div>
          <div style="font-size:0.75rem;color:var(--m);margin:2px 0;">${s.delivery_address||''}</div>
          <div style="display:flex;justify-content:space-between;background:rgba(0,0,0,0.25);padding:4px 8px;border-radius:4px;margin:6px 0;font-size:0.8rem;">
            <span>المطلوب: <b>${s.cod_amount||0}ج</b></span>
            <span>المحصل: <b style="color:#38bdf8;">${am}ج</b></span>
          </div>
          <div class="act
