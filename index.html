<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>أميتشي إكسبريس</title>
<link rel="manifest" href="manifest.json">
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script>
<style>
:root{--bg:#0f172a;--c:#1e293b;--b:#334155;--m:#94a3b8;--s:#16a34a;--w:#d97706;--d:#dc2626}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:var(--bg);color:#f8fafc;padding-bottom:80px}
#splash{position:fixed;inset:0;background:radial-gradient(circle at center,#1e293b 0%,#0f172a 100%);z-index:9999;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:opacity .4s ease}
.logo-box{width:90px;height:90px;background:linear-gradient(135deg,#0284c7,#38bdf8);border-radius:24px;display:flex;justify-content:center;align-items:center;box-shadow:0 12px 30px rgba(56,189,248,.35);margin-bottom:14px}
header{background:var(--c);padding:10px;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:50}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.btns{display:flex;gap:4px;overflow-x:auto}
.bh{background:#334155;border:1px solid #475569;color:#fff;padding:6px 7px;border-radius:5px;font-size:.7rem;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center}
.in{width:100%;background:#0f172a;color:#fff;border:1px solid var(--b);padding:5px;border-radius:5px;font-size:.75rem;outline:none}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:6px}
.sb{background:rgba(0,0,0,.25);padding:4px;border-radius:6px;border:1px solid var(--b)}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;padding:8px 10px 0}
.tab{background:var(--c);border:1px solid var(--b);color:var(--m);padding:7px 4px;border-radius:6px;font-size:.73rem;font-weight:700;cursor:pointer;text-align:center}
.tab.act{background:#0284c7;color:#fff;border-color:#38bdf8}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px}
.kb{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:7px;text-align:center}
.card{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:10px;margin:8px 10px}
.acts{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:4px;margin:6px 0}
.ba{border:1px solid var(--b);color:#fff;padding:5px;border-radius:5px;text-decoration:none;text-align:center;font-size:.75rem;font-weight:700}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.bs{border:none;padding:8px;border-radius:5px;font-weight:700;font-size:.75rem;cursor:pointer;color:#fff}
.ab{display:flex;gap:4px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--b)}
.badm{flex:1;border:none;color:#fff;padding:6px;border-radius:4px;font-size:.73rem;cursor:pointer;font-weight:700}
.srt{background:#0f172a;border:1px solid var(--b);color:#38bdf8;padding:2px 7px;border-radius:4px;font-size:.75rem;cursor:pointer}
.m{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;justify-content:center;align-items:center;padding:12px}
.mb{background:var(--c);border:1px solid var(--b);border-radius:8px;width:100%;max-width:340px;padding:12px}
.ob{width:100%;text-align:right;background:#0f172a;border:1px solid var(--b);color:#fff;padding:9px;border-radius:6px;margin-bottom:6px;font-size:.8rem;cursor:pointer}
</style>
</head>
<body>

<div id="splash">
  <div class="logo-box">
    <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="3" width="15" height="13" rx="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>
    </svg>
  </div>
  <div style="font-size:1.7rem;font-weight:900;color:#fff">أميتشي</div>
  <div style="font-size:.8rem;color:#38bdf8;font-weight:700;margin-top:3px;letter-spacing:1.5px">AMICI EXPRESS</div>
</div>

<header>
  <div class="top">
    <h1 style="font-size:.9rem;color:#38bdf8">🚚 أميتشي <span id="st" style="font-size:.62rem;color:#eab308">⏳ اتصال...</span></h1>
    <div class="btns">
      <label class="bh" style="background:#0284c7">📷<input type="file" accept="image/*" capture="environment" style="display:none" onchange="doScan(this)"></label>
      <button class="bh" style="background:#059669" id="bX" onclick="oM('mX')">📁 شيت</button>
      <button class="bh" style="background:#7c3aed" id="bExp" onclick="exportExcel()">📊 تقفيل</button>
      <button class="bh" style="background:#0284c7" id="bLoc" onclick="openLocs()">📍 المواقع</button>
      <button class="bh" id="bAddC" onclick="oM('mC')">👥 مناديب</button>
      <button class="bh" onclick="fetchAll()">🔄</button>
      <button class="bh" onclick="oM('mL')">🔐 حساب</button>
    </div>
  </div>
  <div style="display:flex;gap:4px">
    <input id="q" class="in" placeholder="🔍 بحث بالشحنة أو الاسم أو الهاتف..." oninput="render()">
    <button class="bh" style="background:#0f172a;border-color:#38bdf8;color:#38bdf8" onclick="sortNearest()">📍 الأقرب</button>
  </div>
  <div class="g3">
    <div class="sb"><label style="font-size:.6rem;color:var(--m)">التاريخ:</label><div style="display:flex;gap:2px"><input type="date" id="dF" class="in" onchange="render()"><button class="bh" style="padding:2px 5px;font-size:.65rem" onclick="document.getElementById('dF').value='';render()">الكل</button></div></div>
    <div class="sb"><label style="font-size:.6rem;color:var(--m)">المندوب:</label><select id="cF" class="in" onchange="render()"></select></div>
    <div class="sb"><label style="font-size:.6rem;color:var(--m)">الحساب:</label><div id="uN" style="font-size:.72rem;padding:4px;font-weight:700;color:#38bdf8;white-space:nowrap;overflow:hidden">👑 المدير</div></div>
  </div>
</header>

<div class="tabs">
  <button class="tab act" id="tb_pending" onclick="setTab('pending')">📦 قيد التوصيل (<span id="cntP">0</span>)</button>
  <button class="tab" id="tb_done" onclick="setTab('done')">✅ التسليمات (<span id="cntD">0</span>)</button>
  <button class="tab" id="tb_issues" onclick="setTab('issues')">❌ مرتجع/تأجيل (<span id="cntI">0</span>)</button>
</div>

<div class="kpi">
  <div class="kb"><div id="kC" style="font-size:1.1rem;font-weight:700;color:#38bdf8">0</div><div style="font-size:.68rem;color:var(--m)">منجزة</div></div>
  <div class="kb"><div id="kM" style="font-size:1.1rem;font-weight:700;color:#38bdf8">0 ج.م</div><div style="font-size:.68rem;color:var(--m)">محصل</div></div>
</div>
<div id="lst"><p style="text-align:center;color:var(--m);margin-top:30px">جاري التحميل...</p></div>

<div class="m" id="mDel"><div class="mb"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><b>✅ طريقة التسليم</b><span onclick="cM('mDel')">✕</span></div><button class="ob" onclick="okDel('كاش')">💵 استلام نقدي (كاش)</button><button class="ob" onclick="okDel('إنستاباي / محفظة')">📱 إنستاباي / فودافون كاش</button><button class="ob" onclick="okDel('بالفرع')">🏢 تسليم بالفرع</button></div></div>
<div class="m" id="mRet"><div class="mb"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><b>❌ سبب المرتجع / الرفض</b><span onclick="cM('mRet')">✕</span></div><button class="ob" onclick="okRet('لا يرد')">📵 العميل لا يرد</button><button class="ob" onclick="okRet('غير متاح / مغلق')">📴 مغلق أو غير متاح</button><button class="ob" onclick="okRet('رفض الاستلام')">🚫 العميل رفض الاستلام</button><button class="ob" onclick="okRet('عنوان خاطئ')">📍 عنوان خاطئ</button><div style="display:flex;gap:4px"><input id="cRet" class="in" placeholder="سبب آخر..."><button class="bs" style="background:var(--d)" onclick="okRet(document.getElementById('cRet').value||'مرتجع')">حفظ</button></div></div></div>
<div class="m" id="mC"><div class="mb"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><b>👥 إدارة المناديب</b><span onclick="cM('mC')">✕</span></div><input id="nCN" class="in" placeholder="اسم المندوب" style="margin-bottom:6px"><input id="nCP" class="in" placeholder="الرقم السري PIN" inputmode="numeric" style="margin-bottom:8px"><button class="bs" style="background:var(--s);width:100%;margin-bottom:8px" onclick="addC()">+ إضافة مندوب</button><div id="cBox" style="max-height:150px;overflow-y:auto;font-size:.78rem"></div></div></div>
<div class="m" id="mTr"><div class="mb"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><b>🔄 نقل الأوردر</b><span onclick="cM('mTr')">✕</span></div><select id="tC" class="in" style="margin-bottom:8px"></select><button class="bs" style="background:#0284c7;width:100%" onclick="okTr()">نقل الآن ➜</button></div></div>
<div class="m" id="mLoc"><div class="mb"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><b>📍 مواقع المناديب</b><span onclick="cM('mLoc')">✕</span></div><div id="lBox" style="max-height:220px;overflow-y:auto;font-size:.8rem"></div></div></div>
<div class="m" id="mShp"><div class="mb"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><b>🚚 شحن فقط</b><span onclick="cM('mShp')">✕</span></div><input type="number" id="sAmt" class="in" value="75" style="margin-bottom:8px"><button class="bs" style="background:#0d9488;width:100%" onclick="okShp()">تأكيد</button></div></div>
<div class="m" id="mP"><div class="mb"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><b>📦 استلام جزئي</b><span onclick="cM('mP')">✕</span></div><input type="number" id="pAmt" class="in" placeholder="المبلغ المستلم" style="margin-bottom:8px"><button class="bs" style="background:#8b5cf6;width:100%" onclick="okP()">تأكيد</button></div></div>
<div class="m" id="mR"><div class="mb"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><b>📅 تأجيل</b><span onclick="cM('mR')">✕</span></div><input type="date" id="rDt" class="in" style="margin-bottom:8px"><button class="bs" style="background:var(--w);width:100%" onclick="okR()">حفظ</button></div></div>
<div class="m" id="mX"><div class="mb"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><b>📁 رفع شيت CSV</b><span onclick="cM('mX')">✕</span></div><label style="font-size:.7rem;color:var(--m)">تاريخ الوردية:</label><input type="date" id="csvD" class="in" style="margin-bottom:6px"><select id="csvC" class="in" style="margin-bottom:8px"></select><input type="file" id="csvF" accept=".csv,.txt" class="in" style="margin-bottom:8px"><button class="bs" style="background:var(--s);width:100%" onclick="upCSV()">رفع ⬆️</button></div></div>
<div class="m" id="mL"><div class="mb"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><b>🔐 تسجيل الدخول</b><span onclick="cM('mL')">✕</span></div><select id="rSel" class="in" style="margin-bottom:8px"></select><input type="password" id="pinIn" class="in" placeholder="الرقم السري PIN" inputmode="numeric" style="margin-bottom:8px"><button class="bs" style="background:#2563eb;width:100%" onclick="login()">دخول</button></div></div>

<script>
setTimeout(()=>{const s=document.getElementById('splash');if(s){s.style.opacity='0';setTimeout(()=>s.style.display='none',400);}},1400);

const BASE='https://difabkjpyypaylnofbcl.supabase.co/rest/v1/';
const API=BASE+'shipments',COUR=BASE+'couriers',LOC=BASE+'courier_locations';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRpZmFia2pweXlwYXlsbm9mYmNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5NzY1OTksImV4cCI6MjEwOTU1MjU5OX0.THAtRh72IfpKvbXxaRK6X9mlWDlkLFjKG6O5DdROZEQ';
const HDR={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=representation'};
let orders=[],cMap={ahmed:{name:'أحمد',pin:'1111'},biko:{name:'بيكو',pin:'2222'},mina:{name:'مينا عبد النور',pin:'3333'}},role='admin',myId='',selIdx=-1,curTab='pending';

const todayStr=new Date().toISOString().split('T')[0];
document.getElementById('csvD').value=todayStr;

const oM=id=>document.getElementById(id).style.display='flex';
const cM=id=>document.getElementById(id).style.display='none';
const cln=s=>String(s||'').replace(/[\u0000-\u001F\u007F-\u009F\uFFFD]/g,'').replace(/["']/g,'').trim();

function setTab(t){
  curTab=t;
  ['pending','done','issues'].forEach(k=>document.getElementById('tb_'+k).classList.toggle('act',k===t));
  render();
}

async function getC(){
  try{const r=await fetch(COUR+'?select=*',{headers:HDR});if(r.ok){const d=await r.json();if(d.length){cMap={};d.forEach(x=>cMap[x.id]={name:x.name,pin:x.pin});}}}catch(e){}
  let oA='<option value="all">عرض كل المناديب</option>',oO='',oR='<option value="admin">👑 المدير</option>',lH='';
  for(let k in cMap){const c=cMap[k];oA+='<option value="'+k+'">'+c.name+'</option>';oO+='<option value="'+k+'">'+c.name+'</option>';oR+='<option value="'+k+'">🚴 '+c.name+'</option>';lH+='<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #334155"><span>🚴 '+c.name+' ('+c.pin+')</span><span style="color:#ef4444;cursor:pointer" onclick="delC(\''+k+'\')">حذف</span></div>';}
  const p=document.getElementById('cF').value||'all';
  document.getElementById('cF').innerHTML=oA;document.getElementById('cF').value=role==='courier'?myId:p;
  document.getElementById('tC').innerHTML=oO;document.getElementById('csvC').innerHTML=oO;document.getElementById('rSel').innerHTML=oR;document.getElementById('cBox').innerHTML=lH;
}
async function addC(){
  const n=document.getElementById('nCN').value.trim(),p=document.getElementById('nCP').value.trim();
  if(!n||!p)return alert('أدخل الاسم والرقم السري');
  const r=await fetch(COUR,{method:'POST',headers:HDR,body:JSON.stringify({id:'c_'+Date.now(),name:n,pin:p})});
  if(r.ok){document.getElementById('nCN').value='';document.getElementById('nCP').value='';await getC();alert('تمت الإضافة');}
}
async function delC(id){if(confirm('حذف المندوب؟')){await fetch(COUR+'?id=eq.'+id,{method:'DELETE',headers:HDR});await getC();}}

function applySavedOrder(list){
  const saved=JSON.parse(localStorage.getItem('am_sort')||'[]');
  if(!saved.length)return list;
  return list.sort((a,b)=>{
    const ia=saved.indexOf(String(a.id)),ib=saved.indexOf(String(b.id));
    if(ia===-1&&ib===-1)return 0;if(ia===-1)return 1;if(ib===-1)return -1;return ia-ib;
  });
}

async function getS(){
  const st=document.getElementById('st');st.style.color='#eab308';st.innerText='⏳ مزامنة...';
  try{const r=await fetch(API+'?select=*',{headers:HDR});if(!r.ok)throw 0;orders=applySavedOrder(await r.json());st.style.color='#22c55e';st.innerText='● متصل';render();}catch(e){st.style.color='#ef4444';st.innerText='❌ خطأ';}
}
async function fetchAll(){await getC();await getS();}

function moveCard(idx,dir){
  const target=idx+dir;
  if(target<0||target>=orders.length)return;
  const tmp=orders[idx];orders[idx]=orders[target];orders[target]=tmp;
  localStorage.setItem('am_sort',JSON.stringify(orders.map(o=>String(o.id))));
  render();
}

function sortNearest(){
  if(!navigator.geolocation)return alert('GPS غير مدعوم');
  navigator.geolocation.getCurrentPosition(p=>{
    const lat=p.coords.latitude,lng=p.coords.longitude;
    const zones=[{k:'عجمي|بيطاش|هانوفيل|شهر العسل',la:31.115,ln:29.785},{k:'مكس|قباري|ورديان',la:31.165,ln:29.855},{k:'محرم بك|كرموز|منشية|محطة الرمل',la:31.195,ln:29.905},{k:'سموحة|سيدي جابر|كليوباترا|سبورتنج|ابراهيمية',la:31.215,ln:29.940},{k:'لوران|جليم|سان ستيفانو|فلمنج|باكوس|رمل',la:31.240,ln:29.965},{k:'سيدي بشر|ميامي|عصافرة|مندرة|منتزه',la:31.270,ln:30.005}];
    const getD=addr=>{for(let z of zones)if(new RegExp(z.k).test(addr))return Math.hypot(lat-z.la,lng-z.ln);return 999;};
    orders.sort((a,b)=>getD(a.delivery_address||'')-getD(b.delivery_address||''));
    localStorage.setItem('am_sort',JSON.stringify(orders.map(o=>String(o.id))));
    render();
    alert('تم ترتيب الشحنات من الأقرب لموقعك!');
  },()=>alert('يرجى تفعيل GPS أولاً'));
}

async function upd(idx,u,label){
  const item=orders[idx];if(!item)return;
  if(label && !confirm('تأكيد تسجيل الحالة:\n['+label+']\nللعميل: '+(item.recipient_name||'')+' ('+(item.tracking_code||'')+')؟'))return;
  document.getElementById('st').innerText='⏳ حفظ...';
  let r=await fetch(API+'?id=eq.'+encodeURIComponent(item.id),{method:'PATCH',headers:HDR,body:JSON.stringify(u)});
  if(!r.ok&&u.reason!==undefined){delete u.reason;r=await fetch(API+'?id=eq.'+encodeURIComponent(item.id),{method:'PATCH',headers:HDR,body:JSON.stringify(u)});}
  if(r.ok)await getS();
}
async function delS(idx){
  const item=orders[idx];if(!item||!confirm('حذف الشحنة نهائياً؟'))return;
  await fetch(API+'?id=eq.'+encodeURIComponent(item.id),{method:'DELETE',headers:HDR});await getS();
}

function oDel(i){selIdx=i;oM('mDel');}
function okDel(m){cM('mDel');const cod=Number(orders[selIdx]?.cod_amount)||0;upd(selIdx,{status:'delivered',collected_amount:cod,reason:m},'تم التسليم ('+m+') - '+cod+' ج.م');}
function oRet(i){selIdx=i;document.getElementById('cRet').value='';oM('mRet');}
function okRet(r){cM('mRet');upd(selIdx,{status:'returned',collected_amount:0,reason:r},'مرتجع ('+r+')');}
function oTr(i){selIdx=i;oM('mTr');}
function okTr(){cM('mTr');const c=document.getElementById('tC').value;upd(selIdx,{courier_id:c},'تحويل إلى '+(cMap[c]?.name||c));}
function oShp(i){selIdx=i;oM('mShp');}
function okShp(){cM('mShp');const a=Number(document.getElementById('sAmt').value)||0;upd(selIdx,{status:'shipping_only',collected_amount:a,reason:''},'تحصيل شحن فقط ('+a+' ج.م)');}
function oP(i){selIdx=i;oM('mP');}
function okP(){cM('mP');const a=Number(document.getElementById('pAmt').value)||0;upd(selIdx,{status:'partial',collected_amount:a,reason:''},'استلام جزئي ('+a+' ج.م)');}
function oR(i){selIdx=i;oM('mR');}
function okR(){cM('mR');const d=document.getElementById('rDt').value;upd(selIdx,{status:'rescheduled',collected_amount:0,rescheduled_date:d,reason:''},'تأجيل إلى '+d);}

function sendLoc(cid){
  if(!navigator.geolocation||!cMap[cid])return;
  navigator.geolocation.getCurrentPosition(p=>fetch(LOC+'?on_conflict=courier_id',{method:'POST',headers:Object.assign({},HDR,{'Prefer':'resolution=merge-duplicates'}),body:JSON.stringify({courier_id:cid,courier_name:cMap[cid].name,lat:p.coords.latitude,lng:p.coords.longitude,updated_at:new Date().toISOString()})}));
}
async function openLocs(){
  oM('mLoc');const b=document.getElementById('lBox');b.innerHTML='جاري التحميل...';
  try{const r=await fetch(LOC+'?select=*',{headers:HDR}),ls=await r.json();if(!ls.length){b.innerHTML='لا يوجد مناديب متصلون بـ GPS.';return;}
  b.innerHTML=ls.map(l=>'<div style="background:#0f172a;padding:8px;border-radius:6px;margin-bottom:6px"><b>🚴 '+l.courier_name+'</b> ('+new Date(l.updated_at).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})+')<br><a href="https://maps.google.com/?q='+l.lat+','+l.lng+'" target="_blank" style="color:#25d366;text-decoration:none;font-weight:700">🗺️ فتح الخريطة</a></div>').join('');}catch(e){b.innerHTML='خطأ.';}
}

function getFilteredList(){
  const q=(document.getElementById('q').value||'').trim().toLowerCase(),cid=document.getElementById('cF').value||'all',df=document.getElementById('dF').value;
  return orders.map((s,realIdx)=>({s,realIdx})).filter(({s})=>{
