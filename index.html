<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>أميتشي إكسبريس</title>
  <style>
    :root{--bg:#0f172a;--c:#1e293b;--b:#334155;--m:#94a3b8;--s:#16a34a;--w:#d97706;--d:#dc2626;}
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;}
    body{background:var(--bg);color:#f8fafc;padding-bottom:85px;}
    header{background:var(--c);padding:10px;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:50;}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
    .btns{display:flex;gap:4px;overflow-x:auto;}
    .btn-h{background:#334155;border:1px solid #475569;color:#fff;padding:6px 9px;border-radius:5px;font-size:0.75rem;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;}
    .s-in{width:100%;background:#0f172a;color:#fff;border:1px solid var(--b);padding:7px;border-radius:6px;font-size:0.8rem;outline:none;margin-bottom:6px;}
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
    .sel-b{background:rgba(0,0,0,0.25);padding:5px;border-radius:6px;border:1px solid var(--b);}
    .c-in{width:100%;background:#0f172a;color:#fff;border:1px solid var(--b);padding:5px;border-radius:4px;font-size:0.75rem;outline:none;}
    .kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px;margin-top:4px;}
    .kpi-b{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:8px;text-align:center;}
    .card{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:10px;margin:8px 10px;}
    .acts{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:4px;margin:6px 0;}
    .btn-a{background:transparent;border:1px solid var(--b);color:#fff;padding:5px;border-radius:5px;text-decoration:none;text-align:center;font-size:0.75rem;font-weight:bold;}
    .st-g{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
    .btn-s{border:none;padding:8px;border-radius:5px;font-weight:bold;font-size:0.75rem;cursor:pointer;color:#fff;}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;justify-content:center;align-items:center;padding:12px;}
    .m-box{background:var(--c);border:1px solid var(--b);border-radius:8px;width:100%;max-width:340px;padding:12px;}
  </style>
</head>
<body>
  <header>
    <div class="top">
      <h1 style="font-size:0.95rem;color:#38bdf8;">أميتشي <span id="uN" style="font-size:0.75rem;color:#fff;">👑 المدير</span></h1>
      <div class="btns">
        <label class="btn-h" style="background:#0284c7;margin:0;">
          📷 باركود
          <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="doScan(this)">
        </label>
        <button type="button" class="btn-h" style="background:#059669;" id="btnXls" onclick="openModal('mX')">📁 شيت</button>
        <button type="button" class="btn-h" style="background:#0284c7;" onclick="openLoc()">📍 المناديب</button>
        <button type="button" class="btn-h" id="btnAdmin" onclick="openModal('mC')">👥 مناديب</button>
        <button type="button" class="btn-h" onclick="openModal('mL')">🔄 حساب</button>
      </div>
    </div>
    <input type="text" id="q" class="s-in" placeholder="🔍 بحث بالشحنة أو الاسم..." oninput="rnd()">
    <div class="g2">
      <div class="sel-b">
        <label style="font-size:0.65rem;color:var(--m);">المندوب:</label>
        <select id="cF" class="c-in" onchange="rnd()">
          <option value="all">عرض كل المناديب</option>
          <option value="ahmed" selected>أحمد</option>
          <option value="biko">بيكو</option>
        </select>
      </div>
      <div class="sel-b">
        <label style="font-size:0.65rem;color:var(--m);">الوردية:</label>
        <input type="date" id="dF" class="c-in" value="2026-11-08">
      </div>
    </div>
  </header>

  <div class="kpi">
    <div class="kpi-b"><div id="kC" style="font-size:1.15rem;font-weight:bold;color:#38bdf8;">0</div><div style="font-size:0.7rem;color:var(--m);">منجزة</div></div>
    <div class="kpi-b"><div id="kM" style="font-size:1.15rem;font-weight:bold;color:#38bdf8;">0 ج.م</div><div style="font-size:0.7rem;color:var(--m);">محصل</div></div>
  </div>

  <div id="lst"></div>

  <!-- النوافذ المنبثقة -->
  <div class="modal" id="mShp">
    <div class="m-box">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>🚚 تحصيل شحن فقط</b><span style="cursor:pointer;" onclick="closeModal('mShp')">✕</span></div>
      <input type="hidden" id="curShpId">
      <label style="font-size:0.75rem;color:var(--m);">مبلغ الشحن المطلوب:</label>
      <input type="number" id="curShpAmt" class="c-in" value="75" style="margin:6px 0 10px;">
      <button type="button" class="btn-s" style="background:#0d9488;width:100%;" onclick="applyShp()">تأكيد الشحن</button>
    </div>
  </div>

  <div class="modal" id="mP">
    <div class="m-box">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>📦 استلام جزئي</b><span style="cursor:pointer;" onclick="closeModal('mP')">✕</span></div>
      <input type="hidden" id="curPId">
      <label style="font-size:0.75rem;color:var(--m);">المبلغ الفعلي المستلم:</label>
      <input type="number" id="curPAmt" class="c-in" placeholder="المبلغ" style="margin:6px 0 10px;">
      <button type="button" class="btn-s" style="background:#8b5cf6;width:100%;" onclick="applyP()">تأكيد المبلغ</button>
    </div>
  </div>

  <div class="modal" id="mR">
    <div class="m-box">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>📅 تأجيل الشحنة</b><span style="cursor:pointer;" onclick="closeModal('mR')">✕</span></div>
      <input type="hidden" id="curRId">
      <label style="font-size:0.75rem;color:var(--m);">تأجيل إلى يوم:</label>
      <input type="date" id="curRDate" class="c-in" style="margin:6px 0 10px;">
      <button type="button" class="btn-s" style="background:var(--w);width:100%;" onclick="applyR()">حفظ التأجيل</button>
    </div>
  </div>

  <div class="modal" id="mX">
    <div class="m-box">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>📁 رفع شيت CSV</b><span style="cursor:pointer;" onclick="closeModal('mX')">✕</span></div>
      <label style="font-size:0.7rem;color:var(--m);">تخصيص للمندوب:</label>
      <select id="csvCourier" class="c-in" style="margin-bottom:8px;">
        <option value="ahmed">أحمد</option>
        <option value="biko">بيكو</option>
      </select>
      <input type="file" id="csvFileInput" accept=".csv,.txt" class="c-in" style="margin-bottom:8px;">
      <button type="button" class="btn-s" style="background:var(--s);width:100%;" onclick="processCSV()">رفع وتوزيع الشحنات</button>
    </div>
  </div>

  <div class="modal" id="mLoc">
    <div class="m-box">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>📍 مواقع المناديب</b><span style="cursor:pointer;" onclick="closeModal('mLoc')">✕</span></div>
      <div id="locBody" style="max-height:240px;overflow-y:auto;"></div>
    </div>
  </div>

  <div class="modal" id="mL">
    <div class="m-box">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>🔐 الحساب</b><span style="cursor:pointer;" onclick="closeModal('mL')">✕</span></div>
      <select id="userRole" class="c-in" style="margin-bottom:10px;">
        <option value="admin">👑 المدير</option>
        <option value="ahmed">🚴 أحمد</option>
      </select>
      <button type="button" class="btn-s" style="background:#2563eb;width:100%;" onclick="applyUserSwitch()">دخول</button>
    </div>
  </div>

  <div class="modal" id="mC">
    <div class="m-box">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b>👥 إدارة المناديب</b><span style="cursor:pointer;" onclick="closeModal('mC')">✕</span></div>
      <input type="text" id="newCourierName" class="c-in" placeholder="اسم المندوب الجديد" style="margin-bottom:6px;">
      <button type="button" class="btn-s" style="background:var(--s);width:100%;margin-bottom:8px;" onclick="addCourierItem()">+ إضافة مندوب</button>
      <div id="courierListContainer" style="max-height:160px;overflow-y:auto;font-size:0.8rem;"></div>
    </div>
  </div>

  <script>
    const INITIAL_DATA = [
      { id:"1", code:"7791", name:"Demyana Botros Zachary", phone:"01001232790", addr:"الاسكندرية العجمي البيطاش ش مسجد الهدي الاندلس والحجاز عمارة 2", cod:190, st:"delivered", coll:190, cid:"ahmed" },
      { id:"2", code:"12258", name:"شروق", phone:"01059947327", addr:"شارع العوامي خلف مدرسة العجمي النموذجية عمارة سنتر الفيروز", cod:610, st:"shipping", coll:50, cid:"ahmed" },
      { id:"3", code:"12282", name:"فيلوباتير", phone:"01507992457", addr:"105 ش المكس القباري - اسكندرية", cod:610, st:"partial", coll:400, cid:"ahmed" }
    ];

    let shipments = [];
    try {
      const stored = localStorage.getItem('am_shipments_master');
      shipments = stored ? JSON.parse(stored) : INITIAL_DATA;
    } catch(e) {
      shipments = INITIAL_DATA;
    }

    let couriers = [];
    try {
      const storedC = localStorage.getItem('am_couriers_master');
      couriers = storedC ? JSON.parse(storedC) : [{id:'ahmed', name:'أحمد'}, {id:'biko', name:'بيكو'}];
    } catch(e) {
      couriers = [{id:'ahmed', name:'أحمد'}, {id:'biko', name:'بيكو'}];
    }

    let currentUser = { role: 'admin', name: 'المدير' };
    try {
      const savedUser = localStorage.getItem('am_current_user');
      if (savedUser) currentUser = JSON.parse(savedUser);
    } catch(e) {}

    function openModal(id){ document.getElementById(id).style.display = 'flex'; }
    function closeModal(id){ document.getElementById(id).style.display = 'none'; }

    function saveAll(){
      localStorage.setItem('am_shipments_master', JSON.stringify(shipments));
      localStorage.setItem('am_couriers_master', JSON.stringify(couriers));
      localStorage.setItem('am_current_user', JSON.stringify(currentUser));
    }

    function syncCouriersUI(){
      let selectHtml = '<option value="all">عرض كل المناديب</option>';
      let modalSelectHtml = '';
      let listHtml = '';

      couriers.forEach(c => {
        selectHtml += `<option value="${c.id}">${c.name}</option>`;
        modalSelectHtml += `<option value="${c.id}">${c.name}</option>`;
        listHtml += `<div style="padding:4px 0;border-bottom:1px solid #334155;">🚴 ${c.name}</div>`;
      });

      document.getElementById('cF').innerHTML = selectHtml;
      document.getElementById('csvCourier').innerHTML = modalSelectHtml;
      document.getElementById('courierListContainer').innerHTML = listHtml;

      let userSelHtml = '<option value="admin">👑 المدير</option>';
      couriers.forEach(c => {
        userSelHtml += `<option value="${c.id}">🚴 ${c.name}</option>`;
      });
      document.getElementById('userRole').innerHTML = userSelHtml;
    }

    function applyUserInterface(){
      document.getElementById('uN').innerText = currentUser.role === 'admin' ? '👑 المدير' : '🚴 ' + currentUser.name;
      const isAdmin = (currentUser.role === 'admin');
      document.getElementById('btnXls').style.display = isAdmin ? 'inline-flex' : 'none';
      document.getElementById('btnAdmin').style.display = isAdmin ? 'inline-flex' : 'none';
      
      const cf = document.getElementById('cF');
      if (!isAdmin) {
        cf.value = currentUser.id;
        cf.disabled = true;
      } else {
        cf.disabled = false;
      }
    }

    function rnd(){
      const q = (document.getElementById('q').value || '').trim().toLowerCase();
      const cf = document.getElementById('cF');
      const cid = (currentUser.role === 'courier') ? currentUser.id : (cf ? cf.value : 'all');

      const list = shipments.filter(s => {
        const mQ = !q || (s.code.includes(q) || s.name.toLowerCase().includes(q) || s.addr.toLowerCase().includes(q) || s.phone.includes(q));
        const mC = (cid === 'all' || s.cid === cid);
        return mQ && mC;
      });

      let done = 0, money = 0, h = '';
      list.forEach((s, idx) => {
        if(['delivered', 'shipping', 'partial'].includes(s.st)){
          done++;
          money += Number(s.coll || 0);
        }

        let badge = s.st === 'delivered' ? 'تم التسليم ✓' :
                    s.st === 'shipping' ? `شحن (${s.coll}ج)` :
                    s.st === 'partial' ? 'استلام جزئي' :
                    s.st === 'rescheduled' ? `مؤجل: ${s.rDate || ''}` :
                    s.st === 'returned' ? 'مرتجع ✕' : 'قيد التوصيل';

        const wa = `https://wa.me/2${s.phone}?text=${encodeURIComponent('السلام عليكم أستاذ '+s.name+'، شحنتك رقم ('+s.code+') مطلوب '+s.cod+' ج')}`;

        h += `
        <div class="card">
          <div style="display:flex;justify-content:space-between;font-weight:bold;margin-bottom:4px;">
            <span style="color:#38bdf8;">#${idx+1} 🏷️ ${s.code}</span>
            <span style="font-size:0.75rem;padding:2px 6px;border-radius:4px;background:#334155;">${badge}</span>
          </div>
          <div style="font-weight:600;">${s.name}</div>
          <div style="font-size:0.75rem;color:var(--m);margin:2px 0;">${s.addr}</div>
          <div style="display:flex;justify-content:space-between;background:rgba(0,0,0,0.25);padding:4px 8px;border-radius:4px;margin:6px 0;font-size:0.8rem;">
            <span>المطلوب: <b>${s.cod}ج</b></span>
            <span>المحصل: <b style="color:#38bdf8;">${s.coll}ج</b></span>
          </div>
          <div class="acts">
            <a href="tel:${s.phone}" class="btn-a">📞 اتصال</a>
            <a href="${wa}" target="_blank" class="btn-a" style="border-color:#25d366;color:#25d366;">💬 واتساب</a>
            <a href="https://maps.google.com/?q=${encodeURIComponent(s.addr)}" target="_blank" class="btn-a">🗺️ خريطة</a>
          </div>
          <div class="st-g">
            <button type="button" class="btn-s" style="background:var(--s);grid-column:span 2;" onclick="setOrderState('${s.id}', 'delivered', ${s.cod})">تم التسليم كامل ✓</button>
            <button type="button" class="btn-s" style="background:#8b5cf6;" onclick="openP('${s.id}')">استلام جزئي</button>
            <button type="button" class="btn-s" style="background:#0d9488;" onclick="openShp('${s.id}')">شحن فقط 🚚</button>
            <button type="button" class="btn-s" style="background:var(--w);" onclick="openR('${s.id}')">تأجيل 📅</button>
            <button type="button" class="btn-s" style="background:var(--d);" onclick="setOrderState('${s.id}', 'returned', 0)">مرتجع ✕</button>
          </div>
        </div>`;
      });

      document.getElementById('lst').innerHTML = h || '<p style="text-align:center;color:var(--m);margin-top:20px;">لا توجد شحنات.</p>';
      document.getElementById('kC').innerText = done;
      document.getElementById('kM').innerText = money + ' ج.م';
    }

    function setOrderState(id, st, coll, extra={}){
      const item = shipments.find(x => String(x.id) === String(id));
      if(item){
        item.st = st;
        item.coll = coll;
        Object.assign(item, extra);
        saveAll();
        rnd();
      }
    }

    // شحن فقط
    function openShp(id){
      document.getElementById('curShpId').value = id;
      document.getElementById('curShpAmt').value = 75;
      openModal('mShp');
    }
    function applyShp(){
      const id = document.getElementById('curShpId').value;
      const amt = Number(document.getElementById('curShpAmt').value) || 0;
      closeModal('mShp');
      setOrderState(id, 'shipping', amt);
    }

    // استلام جزئي
    function openP(id){
      document.getElementById('curPId').value = id;
      document.getElementById('curPAmt').value = '';
      openModal('mP');
    }
    function applyP(){
      const id = document.getElementById('curPId').value;
      const amt = Number(document.getElementById('curPAmt').value) || 0;
      closeModal('mP');
      setOrderState(id, 'partial', amt);
    }

    // تأجيل
    function openR(id){
      document.getElementById('curRId').value = id;
      openModal('mR');
    }
    function applyR(){
      const id = document.getElementById('curRId').value;
      const d = document.getElementById('curRDate').value;
      closeModal('mR');
      setOrderState(id, 'rescheduled', 0, { rDate: d });
    }

    // خدمة تبديل الحساب
    function applyUserSwitch(){
      const val = document.getElementById('userRole').value;
      if (val === 'admin') {
        currentUser = { role: 'admin', name: 'المدير' };
      } else {
        const found = couriers.find(c => c.id === val);
        currentUser = { role: 'courier', id: val, name: found ? found.name : val };
        
        // تسجيل موقع المندوب لحظياً
        if(navigator.geolocation){
          navigator.geolocation.getCurrentPosition(p => {
            const locs = JSON.parse(localStorage.getItem('am_active_locations') || '{}');
            locs[val] = { name: currentUser.name, lat: p.coords.latitude, lng: p.coords.longitude, time: new Date().toLocaleTimeString('ar-EG') };
            localStorage.setItem('am_active_locations', JSON.stringify(locs));
          });
        }
      }
      saveAll();
      closeModal('mL');
      applyUserInterface();
      rnd();
    }

    // خدمة إدارة المناديب
    function addCourierItem(){
      const name = document.getElementById('newCourierName').value.trim();
      if(!name) return;
      const newId = 'c_' + Date.now();
      couriers.push({ id: newId, name: name });
      saveAll();
      syncCouriersUI();
      document.getElementById('newCourierName').value = '';
      alert('تمت إضافة المندوب ' + name + ' بنجاح');
    }

    // خدمة مواقع المناديب
    function openLoc(){
      openModal('mLoc');
      const container = document.getElementById('locBody');
      const locs = JSON.parse(localStorage.getItem('am_active_locations') || '{}');
      
      let html = '';
      couriers.forEach(c => {
        const l = locs[c.id];
        if (l) {
          html += `
          <div style="background:#0f172a;padding:8px;border-radius:6px;margin-bottom:6px;border:1px solid #334155;">
            <div style="font-weight:bold;color:#38bdf8;">🚴 ${l.name}</div>
            <div style="font-size:0.7rem;color:var(--m);margin:2px 0;">آخر ظهور: ${l.time}</div>
            <a href="https://maps.google.com/?q=${l.lat},${l.lng}" target="_blank" style="color:#25d366;text-decoration:none;font-size:0.75rem;font-weight:bold;">🗺️ فتح الموقع على خرائط جوجل</a>
          </div>`;
        } else {
          html += `<div style="background:#0f172a;padding:6px;border-radius:6px;margin-bottom:4px;color:var(--m);font-size:0.75rem;">🚴 ${c.name}: لم يسجل موقعه بعد</div>`;
        }
      });

      container.innerHTML = html || 'لا توجد بيانات مواقع بعد.';
    }

    // خدمة رفع شيت CSV
    function processCSV(){
      const fi = document.getElementById('csvFileInput');
      if(!fi.files || !fi.files[0]) return alert('يرجى اختيار ملف CSV');
      const targetCourier = document.getElementById('csvCourier').value;
      
      const reader = new FileReader();
      reader.onload = function(e){
        const lines = e.target.result.split(/\r?\n/).filter(r => r.trim());
        let count = 0;
        for(let i = 1; i < lines.length; i++){
          const cols = lines[i].split(',');
          if(cols.length >= 4){
            shipments.push({
              id: 'imp_' + Date.now() + '_' + i,
              code: cols[0].replace(/["']/g,'').trim(),
              name: cols[1].replace(/["']/g,'').trim(),
              phone: cols[2].replace(/["']/g,'').trim(),
              addr: cols[3].replace(/["']/g,'').trim(),
              cod: Number(cols[4]) || 0,
              st: 'out',
              coll: 0,
              cid: targetCourier
            });
            count++;
          }
        }
        if(count > 0){
          saveAll();
          closeModal('mX');
